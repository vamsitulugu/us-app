# Wakes the server and sends any scheduled / repeating admin push that is due.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → add
#   SERVER_URL   e.g. https://us-app-av6d.onrender.com
#   CRON_SECRET  the same value you set as CRON_SECRET on Render
name: push-scheduler
on:
  schedule:
    - cron: '*/5 * * * *'     # GitHub runs this about every 5 min (it can be a few minutes late)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send due pushes
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SERVER_URL / CRON_SECRET not set"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -X POST "$SERVER_URL/api/cron/notifications" -H "x-cron-secret: $CRON_SECRET"
