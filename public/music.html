<!DOCTYPE html>
<html lang="en">
<head>
<script src="/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14030e">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<title>Music 🎵</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme-burgundy.css">
<link rel="stylesheet" href="/music/music.css">
<script src="/js/scroll-reset.js"></script>
<link rel="stylesheet" href="/theme-tokens.css?v=2">
<link rel="stylesheet" href="/theme-light-v2.css?v=2">
<link rel="stylesheet" href="/theme-dark-v2.css?v=1">
<link rel="stylesheet" href="/theme-dark-glass.css?v=5">
<link rel="stylesheet" href="/no-scrollbar.css?v=1">
</head>
<body>

<!-- Root screen (Music · My Recordings). Everything else is pushed on top of it by MX.nav. -->
<div id="app"><section class="screen active" id="home" data-scroll-root></section></div>

<div id="mini" aria-label="Now playing"></div>
<div id="player" aria-label="Player"></div>
<div id="sing" aria-label="Karaoke"></div>
<div id="recorder" class="ov"></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- hidden pickers (songs go through the import pipeline; .lrc files go to the lyrics screen) -->
<input type="file" id="fileIn" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus" hidden>
<input type="file" id="lrcIn" accept=".lrc,.txt,text/plain" hidden>

<!-- realtime (pinned) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<!-- music app: core → engine → screens → shell -->
<script src="/music/core.js"></script>
<script src="/music/player.js"></script>
<script src="/music/library.js"></script>
<script src="/music/nowplaying.js"></script>
<script src="/music/karaoke.js"></script>
<script src="/music/recordings.js"></script>
<script src="/music/settings.js"></script>
<script src="/music/app.js"></script>

<!-- services that keep their own logic: video-call karaoke, lyrics pipeline, importer -->
<script src="/couple-karaoke.js"></script>
<script src="/lyrics-cache.js"></script>
<script src="/lyrics-provider.js"></script>
<script src="/lyrics-background-worker.js"></script>
<script src="/lyrics-manager.js"></script>
<script src="/lyrics-admin-dashboard.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="/metadata-service.js"></script>
<script src="/metadata-normalizer.js"></script>
<script src="/lyrics-search.js"></script>
<script src="/lyrics-import-service.js"></script>
<script src="/artwork-service.js"></script>
<script src="/cache-service.js"></script>
<script src="/import-service.js"></script>
<script src="/js/pro-card.js?v=1"></script>
<script src="/js/music-search.js"></script>
</body>
</html>
