<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<title>Collection</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --h: 215;
  --accent: hsl(var(--h),100%,62%);
  --accent-d: hsl(var(--h),95%,50%);
  --accent-l: hsl(var(--h),100%,78%);
  --accent-glow: hsla(var(--h),100%,62%,0.35);
  --accent2: hsl(300,85%,65%);
  --accent2-d: hsl(300,80%,52%);
  --accent2-glow: hsla(300,85%,65%,0.35);
  --g1: rgba(255,255,255,0.04);
  --g2: rgba(255,255,255,0.08);
  --g3: rgba(255,255,255,0.13);
  --blur: blur(24px) saturate(180%);
  --ff-serif: 'DM Serif Display',Georgia,serif;
  --ff-sans: 'Inter',system-ui,sans-serif;
  --r: 18px; --rs: 12px; --rss: 8px;
  --white: #ffffff;
  --text: rgba(255,255,255,0.92);
  --text2: rgba(255,255,255,0.62);
  --text3: rgba(255,255,255,0.38);
  --border: rgba(255,255,255,0.10);
  --border2: rgba(255,255,255,0.18);
  --green: #34d399; --green-bg: rgba(52,211,153,0.15);
  --red: #f87171; --red-bg: rgba(248,113,113,0.15);
  --yellow: #fbbf24; --yellow-bg: rgba(251,191,36,0.15);
  --t: all 0.22s cubic-bezier(0.4,0,0.2,1);
  --t-spring: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--ff-sans);color:var(--text);min-height:100vh;background:transparent;line-height:1.5}

/* ── TABS ── */
.col-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 16px}
.col-tabs::-webkit-scrollbar{display:none}
.col-tab{padding:14px 20px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:var(--t);margin-bottom:-1px}
.col-tab:hover{color:var(--white)}
.col-tab.active{color:var(--white);border-bottom-color:var(--accent)}

/* ── HERO STATS ── */
.col-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:2px}
@media(max-width:500px){.col-hero{grid-template-columns:repeat(2,1fr)}}
.col-stat{background:var(--g1);border:1px solid var(--border);border-radius:var(--r);padding:13px 10px;text-align:center;backdrop-filter:var(--blur);transition:var(--t)}
.col-stat:hover{transform:translateY(-2px)}
.col-stat-n{font-family:var(--ff-serif);font-size:22px;color:var(--white);line-height:1}
.col-stat-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-top:4px}

/* ── TOOLBAR ── */
.col-toolbar{display:flex;gap:8px;padding:12px 16px;align-items:center;flex-wrap:wrap}
.col-search{flex:1;min-width:120px;background:var(--g1);border:1px solid var(--border);border-radius:12px;padding:9px 14px;color:var(--white);font-family:var(--ff-sans);font-size:13px;outline:none;transition:var(--t)}
.col-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.col-filter{padding:7px 13px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--g1);color:var(--text2);transition:var(--t);white-space:nowrap}
.col-filter:hover{color:var(--white);background:var(--g2)}
.col-filter.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px var(--accent-glow)}
.col-sort-select{padding:8px 12px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--g1);color:var(--text2);font-family:var(--ff-sans);cursor:pointer;outline:none}
.col-sort-select:focus{border-color:var(--accent)}
.col-sort-select option{background:#0d0d1f;color:#fff}

/* ── VOICE LIST ── */
.voice-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.voice-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:16px;
  background:var(--g1);border:1px solid var(--border);
  transition:var(--t);position:relative;overflow:hidden;
  min-height:64px;
}
.voice-item:hover{background:var(--g2);border-color:var(--border2)}
.voice-item.playing{background:hsla(var(--h),100%,62%,0.1);border-color:hsla(var(--h),100%,62%,0.3)}
.voice-item.favorited{border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.05)}
.voice-av{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;
  position:relative;overflow:hidden;border:2px solid rgba(255,255,255,0.2);
}
.voice-av.me{background:linear-gradient(135deg,var(--accent),var(--accent-d))}
.voice-av.partner{background:linear-gradient(135deg,var(--accent2),var(--accent2-d))}
.voice-play-btn{
  width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent-d));
  color:#fff;box-shadow:0 4px 12px var(--accent-glow);transition:var(--t-spring);flex-shrink:0;
}
.voice-play-btn:hover{transform:scale(1.08)}
.voice-play-btn:active{transform:scale(0.95)}
.voice-play-btn.playing{background:linear-gradient(135deg,var(--accent2),var(--accent2-d));box-shadow:0 4px 12px var(--accent2-glow)}
/* min-width:0 lets this shrink inside the flex row, but flex-basis (via
   the "1 1 56px" shorthand) guarantees it never gets squeezed to ~0px by
   its sibling — that collapse-to-nothing is what forced the sender name
   into a single-character-per-line vertical stack. */
.voice-info{flex:1 1 56px;min-width:0}
.voice-sender{
  font-size:12.5px;font-weight:700;color:var(--white);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.voice-date{font-size:10.5px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voice-waveform{
  display:flex;align-items:center;gap:2px;height:26px;
  flex:1 1 auto;min-width:0;max-width:100px;cursor:pointer;position:relative;
  overflow:hidden;
}
.voice-waveform span{display:inline-block;border-radius:3px;background:rgba(255,255,255,0.25);width:3px;transition:background 0.2s;flex-shrink:0}
.voice-item.playing .voice-waveform span.wf-played{background:var(--accent)}
.voice-item.playing .voice-waveform span.wf-active-anim{animation:waveAnim 0.6s ease-in-out infinite alternate}
.voice-item.playing .voice-waveform span:nth-child(2n).wf-active-anim{animation-delay:0.1s}
.voice-item.playing .voice-waveform span:nth-child(3n).wf-active-anim{animation-delay:0.2s}
@keyframes waveAnim{from{transform:scaleY(0.4)}to{transform:scaleY(1.0)}}
.voice-dur{font-size:10.5px;color:var(--text3);font-weight:600;white-space:nowrap;flex-shrink:0}
.voice-actions{display:flex;gap:4px;flex-shrink:0;align-items:center}
.voice-action-btn{width:30px;height:30px;min-width:30px;border-radius:8px;border:none;cursor:pointer;background:var(--g2);color:var(--text2);font-size:13px;display:flex;align-items:center;justify-content:center;transition:var(--t)}
.voice-action-btn:hover{background:var(--g3);color:var(--white)}
.voice-action-btn.fav{color:var(--yellow)}
.voice-action-btn.del:hover{background:var(--red-bg);color:var(--red)}
/* Mobile: the 4-5 inline buttons don't fit next to avatar+play+name+
   waveform+duration on a ~360-390px screen — that overflow (inside an
   overflow:hidden card) is what clipped the rightmost buttons out of
   the clickable area. Collapse to one kebab; keep everything inline
   on wider screens where there's room. */
.voice-act-kebab{display:none}
@media(max-width:640px){
  .voice-act-inline{display:none}
  .voice-act-kebab{display:flex;width:36px;height:36px;min-width:36px;font-size:18px}
}
.voice-lib-badge{font-size:9px;font-weight:700;background:hsla(var(--h),100%,62%,0.18);color:var(--accent);border:1px solid hsla(var(--h),100%,62%,0.3);border-radius:8px;padding:2px 6px;flex-shrink:0}
.voice-seek-wrap{position:relative;flex:1;max-width:120px}
.voice-seek-fill{position:absolute;top:0;left:0;bottom:0;background:hsla(var(--h),100%,62%,0.18);border-radius:6px;pointer-events:none;transition:width 0.1s linear;z-index:0}
.voice-waveform{position:relative;z-index:1}
.voice-select-toggle{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--g1);color:var(--text2);white-space:nowrap;transition:var(--t)}
.voice-select-toggle.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── VOICE KEBAB ACTION SHEET ── */
.voice-action-sheet{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.voice-action-sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(2px)}
.voice-action-sheet-panel{position:relative;width:100%;max-width:420px;background:#181022;border:1px solid var(--border2);border-radius:20px 20px 0 0;padding:10px;display:flex;flex-direction:column;gap:2px;animation:sheetUp 0.22s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.voice-sheet-item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;border:none;background:transparent;color:var(--white);font-size:14px;font-family:var(--ff-sans);text-align:left;cursor:pointer;width:100%}
.voice-sheet-item:hover, .voice-sheet-item:active{background:var(--g2)}
.voice-sheet-item.danger{color:var(--red)}
.voice-sheet-cancel{margin-top:4px;justify-content:center;color:var(--text2);font-weight:600;border-top:1px solid var(--border);padding-top:14px;border-radius:0}
@media(min-width:641px){.voice-action-sheet-panel{max-width:280px;margin:0 24px 24px 0;border-radius:16px}}

/* Bulk select bar */
.col-bulkbar{display:none;align-items:center;gap:10px;padding:9px 16px;background:hsla(var(--h),100%,62%,0.1);border-top:1px solid hsla(var(--h),100%,62%,0.25);border-bottom:1px solid hsla(var(--h),100%,62%,0.25);font-size:12px;color:var(--text2);position:sticky;top:0;z-index:5}
.col-bulkbar.active{display:flex}
.col-bulkbar button{padding:6px 12px;border-radius:10px;border:1px solid var(--border);background:var(--g2);color:var(--white);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--ff-sans)}
.voice-select-chk{width:18px;height:18px;border-radius:6px;border:2px solid var(--border2);flex-shrink:0;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:11px;color:#fff}
.col-select-mode .voice-select-chk{display:flex}
.voice-select-chk.checked{background:var(--accent);border-color:var(--accent)}

/* ── DATE SEPARATOR ── */
.col-date-sep{
  display:flex;align-items:center;gap:10px;padding:12px 16px 6px;
  font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;
}
.col-date-sep::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── PHOTO GRID ── */
.photo-col-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 16px}
@media(min-width:600px){.photo-col-grid{grid-template-columns:repeat(4,1fr)}}
.photo-col-item{
  aspect-ratio:1;position:relative;overflow:hidden;cursor:pointer;
  border-radius:4px;background:var(--g1);border:1px solid var(--border);transition:var(--t);
}
.photo-col-item:hover{transform:scale(1.02);z-index:2;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.photo-col-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-col-item video{width:100%;height:100%;object-fit:cover;display:block}
.photo-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  opacity:0;transition:var(--t);border-radius:4px;
}
.photo-col-item:hover .photo-overlay{opacity:1}
.photo-overlay-date{font-size:9px;color:rgba(255,255,255,0.8);font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.photo-fav-badge{position:absolute;top:5px;right:5px;font-size:14px;z-index:1}
.photo-video-badge{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,0.6);color:#fff;font-size:9px;padding:2px 6px;border-radius:6px;font-weight:700}
.photo-action-row{position:absolute;bottom:0;left:0;right:0;padding:8px 6px;display:flex;gap:5px;justify-content:center;background:linear-gradient(to top,rgba(0,0,0,0.8),transparent);opacity:0;transition:var(--t);border-radius:0 0 4px 4px}
.photo-col-item:hover .photo-action-row{opacity:1}
.pa-btn{padding:5px 10px;border-radius:8px;border:none;cursor:pointer;font-family:var(--ff-sans);font-size:10px;font-weight:700;color:#fff;background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);transition:var(--t)}
.pa-btn:hover{background:rgba(255,255,255,0.3)}

/* ── LIGHTBOX ── */
.col-lightbox{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.96);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.col-lightbox.open{display:flex}
.col-lightbox img,.col-lightbox video{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:10px}
.col-lb-close{position:absolute;top:16px;right:18px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.col-lb-info{margin-top:16px;text-align:center}
.col-lb-date{font-size:12px;color:rgba(255,255,255,0.7)}
.col-lb-actions{display:flex;gap:10px;margin-top:12px;justify-content:center}
.col-lb-btn{padding:8px 18px;border-radius:12px;border:none;cursor:pointer;font-family:var(--ff-sans);font-size:12px;font-weight:600;transition:var(--t)}
.col-lb-btn.fav{background:var(--yellow-bg);color:var(--yellow);border:1px solid rgba(251,191,36,0.3)}
.col-lb-btn.del{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,0.3)}
.col-lb-btn.dl{background:var(--g2);color:var(--white);border:1px solid var(--border)}

/* ── EMPTY ── */
.col-empty{text-align:center;padding:48px 20px}
.col-empty-ico{font-size:48px;margin-bottom:12px}
.col-empty-text{font-size:13px;color:var(--text3);line-height:1.7}

/* ── SECTION MONTH ── */
.photo-month-sep{padding:14px 16px 8px;display:flex;align-items:center;gap:12px}
.photo-month-label{font-family:var(--ff-serif);font-size:15px;color:var(--white)}
.photo-month-count{font-size:10px;color:var(--text3);font-weight:700;background:var(--g2);padding:2px 8px;border-radius:10px;border:1px solid var(--border)}

/* ── TOAST ── */
#colToast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:rgba(15,15,15,0.9);backdrop-filter:blur(16px);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:9999;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);font-family:var(--ff-sans);font-weight:500}
</style>

<link rel="stylesheet" href="/premium-motion.css">
<link rel="stylesheet" href="/premium-states.css">
  <link rel="stylesheet" href="/responsive-fix.css">
  <link rel="stylesheet" href="/safe-delete.css">
  <script src="/js/scroll-reset.js"></script>

</head>
<body>

<!-- TABS -->
<div class="col-tabs">
  <div class="col-tab active" onclick="switchColTab('voice',this)">🎙️ Voice Messages</div>
  <div class="col-tab" onclick="switchColTab('library',this)">💾 Library</div>
  <div class="col-tab" onclick="switchColTab('photos',this)">📸 Photo Collection</div>
</div>

<!-- HERO STATS -->
<div class="col-hero" id="colHero"></div>

<!-- TOOLBAR -->
<div class="col-toolbar" id="colToolbar">
  <input type="text" class="col-search" id="colSearch" placeholder="Search..." oninput="renderCurrentTab()">
</div>

<!-- BULK BAR -->
<div class="col-bulkbar" id="colBulkBar">
  <span id="colBulkCount">0 selected</span>
  <button onclick="bulkExportToLibrary()">💾 Export to Library</button>
  <button onclick="bulkDelete()">🗑️ Delete</button>
  <button onclick="exitSelectMode()">Cancel</button>
</div>

<!-- SECTIONS -->
<div id="col-section-voice">
  <div class="voice-list" id="voiceList"></div>
</div>
<div id="col-section-library" style="display:none">
  <div class="voice-list" id="libraryList"></div>
</div>
<div id="col-section-photos" style="display:none">
  <div id="photoColContent"></div>
</div>

<!-- LIGHTBOX -->
<div class="col-lightbox" id="colLightbox">
  <button class="col-lb-close" onclick="closeLightbox()">✕</button>
  <img id="colLbImg" src="" alt="" style="display:none">
  <video id="colLbVid" controls style="display:none"></video>
  <div class="col-lb-info">
    <div class="col-lb-date" id="colLbDate"></div>
    <div class="col-lb-actions">
      <button class="col-lb-btn fav" id="colLbFavBtn" onclick="lbToggleFav()">⭐ Favorite</button>
      <button class="col-lb-btn dl" onclick="lbDownload()">⬇️ Save</button>
      <button class="col-lb-btn del" onclick="lbDelete()">🗑️ Delete</button>
    </div>
  </div>
</div>

<div id="colToast"></div>

<script>
// Reuse the same API base + coupleId/role lookup pattern already used by
// music.html — read from the parent frame's window.S (or localStorage
// fallback), never re-invent a separate identity scheme for this page.
const COL_API = (function() {
  try { return window.parent.API || 'https://us-app-av6d.onrender.com'; }
  catch(e) { return 'https://us-app-av6d.onrender.com'; }
})();
async function colApi(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(COL_API + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function getColCoupleCtx() {
  try {
    const parentS = window.parent.S;
    if (parentS && parentS.coupleId) {
      return { coupleId: parentS.coupleId, role: parentS.role || 'user1',
        myName: parentS.myName || 'You', partnerName: parentS.partnerName || 'Partner' };
    }
  } catch(e) {}
  try {
    const raw = localStorage.getItem('uwl_v5');
    if (raw) {
      const d = JSON.parse(raw);
      if (d.coupleId) return { coupleId: d.coupleId, role: d.role || 'user1',
        myName: d.myName || 'You', partnerName: d.partnerName || 'Partner' };
    }
  } catch(e) {}
  return null;
}

let colState = {
  voices: [],   // loaded from the real chat_messages table via /api/chat — same
                // data Chat itself renders, not a separate/stale copy
  library: [],  // exported voice messages — persist independently of chat
  photos: [],   // extracted from parent photos
  myName: 'You',
  partnerName: 'Partner',
  role: 'user1',
  coupleId: null,
  // Voice-tab favorites mirror chat_messages.starred_by (the same shared,
  // persisted mechanism Chat's own star button uses) — recomputed after
  // every load, never stored separately. Library-tab favorites are a
  // local-only concept since Library entries are local export copies.
  voiceFavs: [],
  photoFavs: JSON.parse(localStorage.getItem('col_photo_favs') || '[]'),
};
let currentTab = 'voice';
let voiceFilter = 'all';
let photoFilter = 'all';
let voiceSort = 'newest'; // newest | oldest | duration | favorites
let selectMode = false;
let selectedIds = new Set();
let lbCurrentIdx = -1;
let lbCurrentType = 'photo';
let currentPlayingIdx = -1;
let currentPlayingSrc = null;
let seekRAF = null;
const waveformCache = {}; // id -> array of peak heights (0-1)
const voiceAudio = document.getElementById('voiceAudio');
let sharedAudioCtx = null;

function loadLibraryLocal() {
  try { colState.library = JSON.parse(localStorage.getItem('col_voice_library') || '[]'); } catch(e) { colState.library = []; }
}
function saveLibraryLocal() {
  try { localStorage.setItem('col_voice_library', JSON.stringify(colState.library)); } catch(e) { showColToast('Storage full — could not save to library'); }
}
// Push/pull library through the parent app's cloud-synced state (S.voiceLibrary)
// so both partners see exported voice messages without touching chat history.
function pushLibraryToParent() {
  try {
    const ps = window.parent?.S;
    if (!ps) return;
    ps.voiceLibrary = colState.library.map(v => ({ ...v }));
    window.parent.scheduleSave?.();
  } catch(e) {}
}
function pullLibraryFromParent() {
  try {
    const ps = window.parent?.S;

function loadFromParent() {

// ── VOICE MESSAGES — real data, one source of truth ──
// Reads the SAME chat_messages rows Chat itself renders (via the same
// GET /api/chat/:coupleId endpoint chat.js uses), instead of a stale
// copy. No separate voice-message system, no duplicate records.
function fmtDurationLabel(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
}
function chatMsgToVoice(m) {
  const d = new Date(m.created_at);
  const durSec = (m.media_meta && m.media_meta.duration) || 0;
  return {
    id: String(m.id),
    audioData: m.media_url,           // hosted/signed URL — <audio>/fetch both accept a URL same as a data URI
    duration: fmtDurationLabel(durSec),
    durationSec: durSec,
    date: isNaN(d) ? '' : d.toISOString().slice(0,10),
    time: isNaN(d) ? '' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    createdAt: m.created_at,
    by: m.sender_role,
    starredBy: m.starred_by || [],
    path: (m.media_meta && m.media_meta.path) || null,
  };
}
let voicesLoadFailed = false;
function chatMsgToPhoto(m) {
  return {
    id: 'chat_' + m.id,
    url: m.media_url,
    type: m.type === 'gif' ? 'image' : m.type, // gifs render fine as <img>, same as image
    date: (m.created_at || '').slice(0, 10),
    name: 'Chat photo',
    fromChat: true,
  };
}
async function loadVoices() {
  const ctx = getColCoupleCtx();
  if (!ctx || !ctx.coupleId) { voicesLoadFailed = true; return; }
  colState.coupleId = ctx.coupleId;
  colState.role = ctx.role;
  colState.myName = ctx.myName;
  colState.partnerName = ctx.partnerName;
  try {
    const rows = await colApi('GET', '/api/chat/' + ctx.coupleId + '?limit=300');
    voicesLoadFailed = false;
    const visible = (rows || []).filter(m => !m.deleted && !((m.deleted_for || '').split(',').includes(ctx.role)));
    colState.voices = visible
      .filter(m => m.type === 'voice' && m.media_url)
      .map(chatMsgToVoice)
      .sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
    colState.voiceFavs = colState.voices.filter(v => v.starredBy.includes(ctx.role)).map(v => v.id);

    // Merge real chat photos/gifs into colState.photos (parent S.photos,
    // populated separately by loadFromParent, are non-chat album uploads —
    // additive, not a replacement).
    const chatPhotos = visible
      .filter(m => (m.type === 'image' || m.type === 'gif') && m.media_url)
      .map(chatMsgToPhoto);
    const existIds = new Set(colState.photos.filter(p => !p.fromChat).map(p => p.id));
    colState.photos = colState.photos.filter(p => !p.fromChat).concat(chatPhotos.filter(p => !existIds.has(p.id)));
    colState.photos.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  } catch (e) {
    console.warn('loadVoices failed:', e);
    voicesLoadFailed = true;
  }
}

function parseDuration(s) {
  if (!s) return 0;
  const parts = s.split(':');
  return parseInt(parts[0]||0)*60 + parseInt(parts[1]||0);
}

function escHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){ if(!s)return''; try{return new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){return s}}
function fmtDateShort(s){ if(!s)return''; try{return new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}catch(e){return s}}
function fmtMonthYear(s){ if(!s)return''; try{return new Date(s+'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});}catch(e){return s}}
function todayStr(){return new Date().toISOString().slice(0,10)}

function totalVoiceDuration(){
  return colState.voices.reduce((s,v)=>s+v.durationSec,0);

function fmtTotalDur(sec){
  sec = Math.max(0, Math.round(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h > 0) return h + 'h ' + String(m).padStart(2,'0') + 'm';
  if (m > 0) return s > 0 ? (m + 'm ' + s + 's') : (m + 'm');
  return s + 's';
}

// ids off chat_messages may be numeric (bigint) or a uuid string; coerce

function findVoiceByAnyId(id, isLibrary) {

function renderWaveBars(v) {
  const peaks = waveformCache[v.id];
  if (peaks) {
    return peaks.map(p => `<span style="height:${Math.max(4, Math.round(p*26))}px"></span>`).join('');
  }
  // Fallback placeholder bars while real waveform decodes (or if decode fails)
  return Array.from({length:18}, () => `<span style="height:${6+Math.round(Math.random()*14)}px"></span>`).join('');
}

// ── REAL WAVEFORM (decoded from actual audio data via Web Audio) ──
async function generateRealWaveform(id, audioData) {
  try {
    if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const resp = await fetch(audioData);
    const buf = await resp.arrayBuffer();
    const audioBuf = await sharedAudioCtx.decodeAudioData(buf.slice(0));
    const raw = audioBuf.getChannelData(0);
    const samples = 32;
    const blockSize = Math.max(1, Math.floor(raw.length / samples));
    const peaks = [];
    for (let i = 0; i < samples; i++) {
      let sum = 0;
      const start = i * blockSize;
      for (let j = 0; j < blockSize; j++) sum += Math.abs(raw[start + j] || 0);
      peaks.push(Math.min(1, (sum / blockSize) * 4));
    }
    waveformCache[id] = peaks;
    const wf = document.getElementById('wf-' + id);
    if (wf) {
      const seekEl = wf.querySelector('.voice-seek-fill');
      wf.innerHTML = (seekEl ? seekEl.outerHTML : '') + renderWaveBars({ id });
    }
  } catch(e) {
    // Decoding failed (e.g. unsupported format) — keep placeholder bars
    waveformCache[id] = null;
  }
}

function seekWaveform(e, id) {
  if (currentPlayingIdx !== id || !voiceAudio.duration) { playVoice(id, findVoiceById(id)?.audioData); return; }
  const wf = document.getElementById('wf-' + id);
  const rect = wf.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  voiceAudio.currentTime = pct * voiceAudio.duration;
}
function findVoiceById(id) {
  return colState.voices.find(v => v.id === id) || colState.library.find(v => v.id === id);
}

let currentAudio = null;
function playVoice(id, audioData) {
  if (!audioData) { showColToast('Audio not available'); return; }
  const prevId = currentPlayingIdx;
  if (currentPlayingIdx === id) {
    // Pause
    voiceAudio.pause();
    currentPlayingIdx = -1;
    updateVoiceItem(id, false);
    updateVoiceItem(prevId, false);
    stopSeekLoop();
    return;
  }
  if (currentPlayingIdx !== -1) updateVoiceItem(currentPlayingIdx, false);
  currentPlayingIdx = id;
  currentPlayingSrc = audioData;
  voiceAudio.src = audioData;
  voiceAudio.play().catch(e => showColToast('Cannot play audio: ' + e.message));
  updateVoiceItem(id, true);
  startSeekLoop(id);
}
function startSeekLoop(id) {
  stopSeekLoop();
  function tick() {
    if (currentPlayingIdx !== id) return;
    const fill = document.getElementById('wfseek-' + id);
    if (fill && voiceAudio.duration) {
      fill.style.width = ((voiceAudio.currentTime / voiceAudio.duration) * 100) + '%';
    }
    seekRAF = requestAnimationFrame(tick);
  }
  seekRAF = requestAnimationFrame(tick);
}
function stopSeekLoop() { if (seekRAF) cancelAnimationFrame(seekRAF); seekRAF = null; }
function updateVoiceItem(id, playing) {
  const el = document.getElementById('vi-' + id);
  if (!el) return;
  el.classList.toggle('playing', playing);
  const btn = el.querySelector('.voice-play-btn');
  if (btn) { btn.textContent = playing ? '⏸' : '▶'; btn.classList.toggle('playing', playing); }
  if (!playing) { const fill = document.getElementById('wfseek-' + id); if (fill) fill.style.width = '0%'; }
}
voiceAudio.addEventListener('ended', () => {
  if (currentPlayingIdx !== -1) { updateVoiceItem(currentPlayingIdx, false); currentPlayingIdx = -1; stopSeekLoop(); }
});

async function toggleVoiceFav(id) {
  // Voice favorites are server-backed via chat_messages.starred_by (the
  // same column/endpoint Chat's own star button uses) — NOT localStorage.
  // Previously this only mutated a local array + localStorage, so the
  // very next loadVoices() (which recomputes voiceFavs from the server's
  // starredBy field) silently reverted every favorite on refresh/restart.
  const idx = colState.voiceFavs.indexOf(id);
  const wasFav = idx > -1;
  if (wasFav) colState.voiceFavs.splice(idx, 1);
  else colState.voiceFavs.push(id);
  renderCurrentTab(); renderHero();
  try {
    await colApi('POST', '/api/chat/' + id + '/star', { coupleId: colState.coupleId, role: colState.role });
    const v = colState.voices.find(x => x.id === id);
    if (v) v.starredBy = wasFav ? v.starredBy.filter(r => r !== colState.role) : [...v.starredBy, colState.role];
  } catch (e) {
    const idx2 = colState.voiceFavs.indexOf(id);
    if (wasFav && idx2 === -1) colState.voiceFavs.push(id);
    else if (!wasFav && idx2 > -1) colState.voiceFavs.splice(idx2, 1);
    renderCurrentTab(); renderHero();
    showColToast('Could not update favorite: ' + e.message);
  }
}
function openInChat(id) {
  // Collection lives in an iframe; Chat is inline in the parent window
  // (public/index.html), which already has a goto()/Chat.scrollToMsg()
  // pair used by its own in-chat search feature — reuse that same path
  // instead of building a second navigation mechanism.
  try {
    window.parent.postMessage({ type: 'uwl:open-chat-message', messageId: id }, window.location.origin);
  } catch (e) {
    showColToast('Could not open in Chat');
  }
}
// ── KEBAB MENU (mobile) — real actions, not a decorative popup ──
function closeVoiceMenu() {
  document.getElementById('voiceActionSheet')?.remove();
  document.removeEventListener('click', closeVoiceMenu, true);
}
function openVoiceMenu(ev, id, isLibrary) {
  closeVoiceMenu();
  const v = (isLibrary ? colState.library : colState.voices).find(x => x.id === id);
  if (!v) return;
  const isFav = colState.voiceFavs.includes(id);
  const items = [];
  items.push({ label: isFav ? 'Unfavorite' : 'Favorite', ico: isFav ? '⭐' : '☆', run: () => toggleVoiceFav(id) });
  if (!isLibrary) {
    items.push({ label: 'Save to Library', ico: '💾', run: () => exportToLibrary(id) });
    items.push({ label: 'Open in Chat', ico: '💬', run: () => openInChat(id) });
  }
  items.push({ label: 'Download', ico: '⬇️', run: () => downloadVoice(v.audioData || '') });
  items.push({ label: isLibrary ? 'Remove from Library' : 'Delete', ico: '🗑️', run: () => deleteVoice(id, isLibrary), danger: true });

  const sheet = document.createElement('div');
  sheet.id = 'voiceActionSheet';
  sheet.className = 'voice-action-sheet';
  const backdrop = document.createElement('div');
  backdrop.className = 'voice-action-sheet-backdrop';
  backdrop.addEventListener('click', closeVoiceMenu);
  const panel = document.createElement('div');
  panel.className = 'voice-action-sheet-panel';
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'voice-sheet-item' + (it.danger ? ' danger' : '');
    btn.textContent = it.ico + ' ' + it.label;
    btn.addEventListener('click', () => { closeVoiceMenu(); it.run(); });
    panel.appendChild(btn);
  });
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'voice-sheet-item voice-sheet-cancel';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', closeVoiceMenu);
  panel.appendChild(cancelBtn);
  sheet.appendChild(backdrop);
  sheet.appendChild(panel);
  document.body.appendChild(sheet);
  setTimeout(() => document.addEventListener('click', closeVoiceMenu, true), 0);
}

async function downloadVoice(audioData) {
  if (!audioData) return;
  const filename = 'voice-' + Date.now() + '.webm';
  try {
    // audioData is a cross-origin Supabase Storage URL — the anchor
    // `download` attribute is silently ignored by browsers for cross-origin
    // URLs, so a direct a.href=audioData click just navigates the page to
    // it (the "black native audio player" bug). Fetching it as a Blob and
    // downloading that blob: URL instead never navigates away.
    showColToast('Downloading... ⬇️');
    const response = await fetch(audioData);
    if (!response.ok) throw new Error('Fetch failed: ' + response.status);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    showColToast('Saved ✅');
  } catch (err) {
    console.error('Voice download failed:', err);
    showColToast('Download failed ⚠️');
  }
}
function deleteVoice(id, isLibrary) {
  confirmDelete({
    itemType: isLibrary ? 'library item' : 'voice message',
    message: isLibrary
      ? 'This will only remove it from your Library — the original message in Chat is untouched.'
      : 'This voice message will be permanently deleted.',
    onConfirm: async () => {
      if (isLibrary) {
        colState.library = colState.library.filter(v => v.id !== id);
        saveLibraryLocal(); pushLibraryToParent();
        renderCurrentTab(); renderHero();
        showColToast('Removed from library');
        return;
      }
      // Real chat voice messages live in chat_messages (Supabase), not in any
      // in-memory parent array — deleting must go through the same DELETE
      // /api/chat/:id endpoint Chat itself uses, so Collection and Chat never
      // disagree on what's deleted (Part 15/23). Ownership rule mirrors the
      // server: only the sender can delete "for everyone"; the other partner
      // can only delete-for-me (hide on their own device, shared audio stays).
      const v = colState.voices.find(x => x.id === id);
      const mode = (v && v.by === colState.role) ? 'everyone' : 'me';
      try {
        await colApi('DELETE', '/api/chat/' + id, { coupleId: colState.coupleId, senderRole: colState.role, mode });
        colState.voices = colState.voices.filter(x => x.id !== id);
        renderCurrentTab(); renderHero();
        showColToast(mode === 'everyone' ? 'Voice message deleted' : 'Removed from your view');
      } catch (e) {
        // Re-sync from server since the local list may now be stale
        // (e.g. a 403 for trying to delete a partner's message).
        await loadVoices(); renderCurrentTab(); renderHero();
        throw e; // let the modal show the error and stay open
      }
    }
  });
}

// ── EXPORT TO LIBRARY (copy, chat history stays untouched) ──
function exportToLibrary(id) {
  const v = colState.voices.find(x => x.id === id);
  if (!v) return;
  if (colState.library.some(x => x.id === id)) { showColToast('Already saved to Library'); return; }
  colState.library.push({ ...v });
  saveLibraryLocal();
  pushLibraryToParent();
  renderCurrentTab();
  showColToast('💾 Saved to Library — chat history untouched');
}
function bulkExportToLibrary() {
  if (!selectedIds.size) return;
  let added = 0;
  selectedIds.forEach(id => {
    if (colState.library.some(x => x.id === id)) return;
    const v = colState.voices.find(x => x.id === id) || colState.library.find(x => x.id === id);
    if (v) { colState.library.push({ ...v }); added++; }
  });
  saveLibraryLocal(); pushLibraryToParent();
  showColToast('💾 Exported ' + added + ' message' + (added===1?'':'s') + ' to Library');
  exitSelectMode();
}
function bulkDelete() {
  if (!selectedIds.size) return;
  const isLib = currentTab === 'library';
  const idsToDelete = Array.from(selectedIds);
  confirmDelete({
    itemType: isLib ? 'library item' : 'voice message',
    count: idsToDelete.length,
    message: isLib
      ? 'These will only be removed from your Library — the original messages in Chat are untouched.'
      : 'These voice messages will be permanently deleted.',
    onConfirm: async () => {
      if (isLib) {
        idsToDelete.forEach(id => { colState.library = colState.library.filter(v => v.id !== id); });
        saveLibraryLocal(); pushLibraryToParent();
        renderCurrentTab();
        showColToast('Deleted ' + idsToDelete.length + ' message(s)');
        exitSelectMode();
        return;
      }
      // Same server-backed deletion as single-item deleteVoice — fire the
      // real DELETE per message so Chat and Collection can never disagree.
      // Only remove from local state (and report success) for the ones
      // that actually confirmed on the server — never lose track of
      // partial failures (Part 17).
      const { succeeded, failed } = await runBulkDelete(idsToDelete, (id) => {
        const v = colState.voices.find(x => x.id === id);
        const mode = (v && v.by === colState.role) ? 'everyone' : 'me';
        return colApi('DELETE', '/api/chat/' + id, { coupleId: colState.coupleId, senderRole: colState.role, mode });
      });
      colState.voices = colState.voices.filter(v => !succeeded.includes(v.id));
      exitSelectMode();
      await loadVoices();
      renderCurrentTab(); renderHero();
      showColToast(failed.length
        ? `${succeeded.length} deleted. ${failed.length} couldn't be deleted.`
        : 'Deleted ' + succeeded.length + ' message(s)');
    }
  });
}

// ── PHOTO RENDER ──
function renderPhotos() {
  const q = getQuery();
  let photos = colState.photos.filter(p => {
    if (q && !(p.name||'').toLowerCase().includes(q) && !p.date.includes(q)) return false;
    if (photoFilter === 'image') return p.type !== 'video';
    if (photoFilter === 'video') return p.type === 'video';
    if (photoFilter === 'fav') return colState.photoFavs.includes(p.id);
    return true;
  });

  const el = document.getElementById('photoColContent');
  if (!photos.length) {
    el.innerHTML = `<div class="col-empty"><div class="col-empty-ico">📸</div><div class="col-empty-text">${colState.photos.length?'No photos match your filter.':'No photos yet. Upload memories and they\'ll appear here!'}</div></div>`;
    return;
  }

  // Group by month
  const byMonth = {};
  photos.forEach(p => {
    const key = p.date ? p.date.slice(0,7) : 'Unknown';
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(p);
  });

  el.innerHTML = Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([month, list]) => `
    <div class="photo-month-sep">
      <div class="photo-month-label">${fmtMonthYear(month+'-01')}</div>
      <div class="photo-month-count">${list.length} item${list.length!==1?'s':''}</div>
    </div>
    <div class="photo-col-grid">
      ${list.map((p, i) => {
        const isFav = colState.photoFavs.includes(p.id);
        const realIdx = colState.photos.indexOf(p);
        return `<div class="photo-col-item" onclick="openPhotoLightbox(${realIdx})">
          ${p.type === 'video'
            ? `<video src="${p.url}" muted preload="metadata"></video><div class="photo-video-badge">▶ VIDEO</div>`
            : `<img src="${p.url}" loading="lazy" alt="photo">`}
          ${isFav ? '<div class="photo-fav-badge">⭐</div>' : ''}
          <div class="photo-overlay"><div class="photo-overlay-date">${p.date||''}</div></div>
          <div class="photo-action-row">
            <button class="pa-btn" onclick='event.stopPropagation();togglePhotoFav(${JSON.stringify(p.id)})'>${isFav?'★':'☆'}</button>
            <button class="pa-btn" onclick='event.stopPropagation();downloadPhoto(${JSON.stringify(p.url||'')})'>⬇</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

function openPhotoLightbox(idx) {
  lbCurrentIdx = idx;
  lbCurrentType = 'photo';
  const p = colState.photos[idx];
  if (!p) return;
  const img = document.getElementById('colLbImg');
  const vid = document.getElementById('colLbVid');
  if (p.type === 'video') {
    img.style.display = 'none';
    vid.style.display = 'block';
    vid.src = p.url;
  } else {
    vid.style.display = 'none';
    img.style.display = 'block';
    img.src = p.url;
  }
  const isFav = colState.photoFavs.includes(p.id);
  document.getElementById('colLbDate').textContent = fmtDate(p.date) + (p.name && p.name !== 'camera' ? ' · ' + p.name : '');
  document.getElementById('colLbFavBtn').textContent = isFav ? '⭐ Unfavorite' : '☆ Favorite';
  document.getElementById('colLightbox').classList.add('open');
}
function closeLightbox() {
  const vid = document.getElementById('colLbVid');
  vid.pause(); vid.src = '';
  document.getElementById('colLightbox').classList.remove('open');
}
function lbToggleFav() {
  const p = colState.photos[lbCurrentIdx]; if (!p) return;
  const idx = colState.photoFavs.indexOf(p.id);
  if (idx > -1) colState.photoFavs.splice(idx, 1);
  else colState.photoFavs.push(p.id);
  localStorage.setItem('col_photo_favs', JSON.stringify(colState.photoFavs));
  document.getElementById('colLbFavBtn').textContent = colState.photoFavs.includes(p.id) ? '⭐ Unfavorite' : '☆ Favorite';
  renderPhotos(); renderHero();
}
function lbDownload() {
  const p = colState.photos[lbCurrentIdx]; if (!p?.url) return;
  const a = document.createElement('a');
  a.href = p.url;
  a.download = 'memory-' + Date.now() + (p.type==='video'?'.mp4':'.jpg');
  a.click();
  showColToast('Saving to device ⬇️');
}
function lbDelete() {
  const p = colState.photos[lbCurrentIdx];
  if (!p) return;
  confirmDelete({
    itemType: p.type === 'video' ? 'video' : 'photo',
    message: 'This will be permanently deleted from your Memories.',
    onConfirm: async () => {
      colState.photos.splice(lbCurrentIdx, 1);
      try {
        const ps = window.parent?.S;
        if (ps?.photos) {
          ps.photos = ps.photos.filter(x => x.id !== p.id);
          window.parent.scheduleSave?.();
          window.parent.renderPhotos?.();
        }
      } catch(e) {}
      closeLightbox();
      renderPhotos(); renderHero();
      showColToast((p.type === 'video' ? 'Video' : 'Photo') + ' deleted');
    }
  });
}
function togglePhotoFav(id) {
  const idx = colState.photoFavs.indexOf(id);
  if (idx > -1) colState.photoFavs.splice(idx, 1);
  else colState.photoFavs.push(id);
  localStorage.setItem('col_photo_favs', JSON.stringify(colState.photoFavs));
  renderPhotos(); renderHero();
}
function downloadPhoto(url) {
  if (!url) return;
  const a = document.createElement('a');
  a.href = url;
  a.download = 'photo-' + Date.now() + '.jpg';
  a.click();
  showColToast('Saving... ⬇️');
}

// ── TAB SWITCHING ──
function switchColTab(tab, el) {
  currentTab = tab;
  selectMode = false; selectedIds.clear(); updateBulkBar();
  document.querySelectorAll('.col-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('col-section-voice').style.display = tab==='voice'?'block':'none';
  document.getElementById('col-section-library').style.display = tab==='library'?'block':'none';
  document.getElementById('col-section-photos').style.display = tab==='photos'?'block':'none';
  renderToolbar();
  renderHero();
  renderCurrentTab();
}
function renderCurrentTab() {
  if (currentTab === 'voice') renderVoice();
  else if (currentTab === 'library') renderLibrary();
  else renderPhotos();
}

// ── REALTIME SYNC — poll parent for new chat voices + partner library updates ──
let colSyncInterval = null;
function startColSync() {
  if (colSyncInterval) return;
  colSyncInterval = setInterval(() => {
    loadFromParent();
    loadVoices().then(() => { renderHero(); renderCurrentTab(); });
  }, 4000);
}

// ── TOAST ──
let toastTimer;
function showColToast(msg) {
  const t = document.getElementById('colToast');
  t.textContent = msg; t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(12px)'; }, 2600);
}

// ── PARENT MESSAGES ──
window.addEventListener('message', e => {
  if (e.data?.type === 'theme') {
    const r = document.documentElement;
    Object.entries(e.data.vars || {}).forEach(([k,v]) => r.style.setProperty(k,v));
  }
  if (e.data?.type === 'colRefresh') init();
});

// ── INIT ──
async function init() {
  loadLibraryLocal();
  loadFromParent();
  renderToolbar();
  renderHero();
  renderCurrentTab();
  await loadVoices();
  renderHero();
  renderCurrentTab();
  startColSync();
}
init();
