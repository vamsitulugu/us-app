<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Couple Games 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --h:215; --accent:hsl(var(--h),100%,62%); --accent-d:hsl(var(--h),95%,50%); --accent-l:hsl(var(--h),100%,78%); --accent-glow:hsla(var(--h),100%,62%,.35);
  --accent2:hsl(300,85%,65%); --accent2-d:hsl(300,80%,52%); --accent2-glow:hsla(300,85%,65%,.35);
  --gold:#ffc94a; --gold-glow:rgba(255,201,74,.4);
  --g1:rgba(255,255,255,.045); --g2:rgba(255,255,255,.09); --g3:rgba(255,255,255,.15);
  --blur:blur(26px) saturate(180%); --blur-sm:blur(12px) saturate(150%);
  --ff-serif:'DM Serif Display',Georgia,serif; --ff-sans:'Inter',system-ui,sans-serif;
  --white:#fff; --text:rgba(255,255,255,.94); --text2:rgba(255,255,255,.64); --text3:rgba(255,255,255,.38);
  --border:rgba(255,255,255,.11); --border2:rgba(255,255,255,.20);
  --green:#34d399; --green-bg:rgba(52,211,153,.15); --red:#f87171; --red-bg:rgba(248,113,113,.15); --yellow:#fbbf24;
  --t:all .22s cubic-bezier(.4,0,.2,1); --ts:all .35s cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
input,textarea{user-select:text}
body{font-family:var(--ff-sans);color:var(--text);min-height:100vh;background:transparent;line-height:1.5;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:99px}
button{font-family:inherit;cursor:pointer}
.glass{background:var(--g1);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border)}

/* ══ HUB ══ */
.hub{padding:16px 14px 40px;max-width:960px;margin:0 auto}
.hub-hero{text-align:center;padding:10px 0 18px}
.hub-title{font-family:var(--ff-serif);font-size:26px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.hub-sub{font-size:12px;color:var(--text2);margin-top:4px}

.rank-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:14px}
.rank-card{border-radius:20px;padding:14px;position:relative;overflow:hidden;border:1px solid var(--border2);backdrop-filter:var(--blur)}
.rank-card.me{background:linear-gradient(155deg,hsla(var(--h),100%,55%,.18),rgba(255,255,255,.03))}
.rank-card.pt{background:linear-gradient(155deg,hsla(300,85%,60%,.18),rgba(255,255,255,.03))}
.rank-vs{align-self:center;font-family:var(--ff-serif);font-size:20px;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:2px}
.rank-top{display:flex;align-items:center;gap:10px}
.rank-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;border:2px solid rgba(255,255,255,.3);flex-shrink:0;position:relative;overflow:hidden}
.rank-av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rank-card.me .rank-av{background:linear-gradient(135deg,var(--accent),var(--accent-d))}
.rank-card.pt .rank-av{background:linear-gradient(135deg,var(--accent2),var(--accent2-d))}
.rank-online{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--text3);border:2px solid rgba(10,10,20,.9)}
.rank-online.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.rank-name{font-size:13px;font-weight:700;color:#fff}
.rank-lvl{font-size:10px;color:var(--text3);margin-top:1px}
.rank-xpbar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.rank-xpfill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.34,1.56,.64,1)}
.rank-card.me .rank-xpfill{background:linear-gradient(90deg,var(--accent),var(--accent-l))}
.rank-card.pt .rank-xpfill{background:linear-gradient(90deg,var(--accent2),#ff9ec7)}
.rank-stats{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.rank-stat{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);font-weight:600}
.rank-playing{margin-top:9px;font-size:10px;padding:4px 9px;border-radius:20px;background:var(--green-bg);color:var(--green);border:1px solid rgba(52,211,153,.3);display:inline-flex;align-items:center;gap:5px;font-weight:700}
.rank-playing .dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blk 1.4s infinite}
@keyframes blk{0%,100%{opacity:1}50%{opacity:.3}}

.hub-sec-title{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
.hub-sec-title .line{flex:1;height:1px;background:var(--border)}

.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gcard{border-radius:22px;overflow:hidden;position:relative;cursor:pointer;border:1px solid var(--border2);background:var(--g1);backdrop-filter:var(--blur);transition:var(--ts)}
.gcard:hover{transform:translateY(-6px) scale(1.008);box-shadow:0 22px 50px rgba(0,0,0,.45)}
.gcard:active{transform:scale(.97)}
.gcard-art{height:132px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gcard-art::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% -10%,rgba(255,255,255,.18),transparent 60%)}
.gcard-emoji{font-size:58px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));animation:gfloat 3.2s ease-in-out infinite;z-index:1}
@keyframes gfloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.gcard-badges{position:absolute;top:9px;left:9px;display:flex;gap:5px;z-index:2}
.gbadge{font-size:9px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.gbadge.new{background:var(--accent2);color:#fff}
.gbadge.trend{background:var(--gold);color:#3a2600}
.gbadge.live{background:rgba(52,211,153,.9);color:#04241a}
.gfav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;transition:var(--t)}
.gfav.on{background:rgba(255,80,80,.3)}
.gcard-live{position:absolute;bottom:9px;left:9px;font-size:9px;font-weight:700;background:rgba(52,211,153,.25);color:#7cffcf;border:1px solid rgba(52,211,153,.4);padding:3px 8px;border-radius:20px;display:flex;align-items:center;gap:4px;z-index:2}
.gcard-body{padding:14px 15px 15px}
.gcard-title{font-family:var(--ff-serif);font-size:17px;color:#fff;margin-bottom:4px}
.gcard-desc{font-size:11.5px;color:var(--text2);line-height:1.55;margin-bottom:10px;min-height:34px}
.gcard-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.gtag{font-size:9.5px;padding:3px 8px;border-radius:20px;background:var(--g2);color:var(--text2);border:1px solid var(--border);font-weight:600}
.gplay-btn{width:100%;padding:11px;border-radius:13px;border:none;font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;transition:var(--ts)}
.gplay-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.gplay-btn:active{transform:scale(.95)}

/* ══ FULLSCREEN GAME OVERLAY (split: game top / video bottom) ══ */
.goverlay{position:fixed;inset:0;z-index:3000;display:none;flex-direction:column;background:rgba(4,4,10,.55);backdrop-filter:blur(2px)}
.goverlay.open{display:flex}
.goverlay-inner{flex:1;display:flex;flex-direction:column;background:rgba(9,9,20,.9);backdrop-filter:blur(30px) saturate(190%);overflow:hidden;animation:gopop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes gopop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.gohead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(255,255,255,.02)}
.gohead-title{font-family:var(--ff-serif);font-size:15px;color:#fff;flex:1;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gohead-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--g2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.gohead-vidbtn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.15);color:#7cffcf;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:var(--t)}
.gohead-vidbtn.on{background:linear-gradient(135deg,var(--accent2),var(--accent2-d));color:#fff;border-color:transparent;box-shadow:0 0 0 3px var(--accent2-glow)}
.gohead-chip{font-size:9.5px;padding:3px 8px;border-radius:20px;background:var(--g2);border:1px solid var(--border);color:var(--text2);font-weight:700;display:flex;align-items:center;gap:4px;flex-shrink:0}

/* the split body: game area (top) + video strip (bottom, collapsible) */
.gosplit{flex:1;display:flex;flex-direction:column;min-height:0}
.gobody{flex:1;overflow-y:auto;padding:14px;position:relative;min-height:0}
.gobody.nopad{padding:0}

.govideo{flex-shrink:0;height:0;overflow:hidden;transition:height .32s cubic-bezier(.4,0,.2,1);background:#05050c;border-top:1px solid var(--border);position:relative}
.govideo.on{height:34vh;min-height:190px}
.gv-grid{display:flex;height:100%;gap:2px}
.gv-cell{flex:1;position:relative;background:#0a0a14;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gv-cell video{width:100%;height:100%;object-fit:cover}
.gv-cell .gv-label{position:absolute;bottom:6px;left:8px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:20px;z-index:2}
.gv-cell .gv-placeholder{font-size:30px;opacity:.3}
.gv-controls{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.gv-ctrl-btn{width:36px;height:36px;border-radius:50%;background:rgba(20,20,30,.75);backdrop-filter:blur(8px);border:1px solid var(--border2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.gv-ctrl-btn.off{background:rgba(248,113,113,.85)}
.gv-ctrl-btn.end{background:var(--red)}
.gv-status{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:4px 12px;border-radius:20px;z-index:5}

/* generic ui atoms */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:13px;font-size:13px;border:none;font-weight:700;color:#fff;transition:var(--ts)}
.btn:active{transform:scale(.95)}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-d));box-shadow:0 4px 16px var(--accent-glow)}
.btn-pink{background:linear-gradient(135deg,var(--accent2),var(--accent2-d));box-shadow:0 4px 16px var(--accent2-glow)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#e08a00);box-shadow:0 4px 16px var(--gold-glow);color:#3a2600}
.btn-glass{background:var(--g2);color:#fff;border:1px solid var(--border2)}
.btn-sm{padding:7px 12px;font-size:11.5px}
.btn:disabled{opacity:.4;pointer-events:none}
.coin-chip,.xp-chip{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.coin-chip{background:rgba(255,201,74,.15);color:var(--gold);border:1px solid rgba(255,201,74,.3)}
.xp-chip{background:hsla(var(--h),100%,62%,.15);color:var(--accent-l);border:1px solid hsla(var(--h),100%,62%,.3)}

.gtoast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(14,14,14,.88);backdrop-filter:blur(16px);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:.3s cubic-bezier(.4,0,.2,1);pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.45);border:1px solid var(--border2)}
.gtoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.reward-pop{position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(8px)}
.reward-pop.show{display:flex}
.reward-card{background:rgba(255,255,255,.07);backdrop-filter:blur(30px);border:1px solid var(--border2);border-radius:28px;padding:36px 30px;text-align:center;max-width:320px;animation:gopop .4s cubic-bezier(.34,1.56,.64,1)}
.reward-ico{font-size:64px;animation:rewardbeat 1s ease-in-out infinite}
@keyframes rewardbeat{0%,100%{transform:scale(1)}30%{transform:scale(1.2)}}
.reward-title{font-family:var(--ff-serif);font-size:22px;color:#fff;margin-top:12px}
.reward-items{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.reward-item{background:var(--g2);border:1px solid var(--border);border-radius:14px;padding:10px 16px;font-size:14px;font-weight:800}

/* ═══ TURN BAR (shared across games) ═══ */
.turn-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--g1);border:1px solid var(--border);margin-bottom:12px;font-size:12.5px;font-weight:700}
.turn-bar.mine{background:linear-gradient(135deg,hsla(var(--h),100%,55%,.16),rgba(255,255,255,.02));border-color:hsla(var(--h),100%,62%,.3);color:var(--accent-l)}
.score-bar{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
.score-pill{flex:1;text-align:center;padding:9px;border-radius:13px;background:var(--g1);border:1px solid var(--border)}
.score-pill.mine{border-color:var(--accent);background:hsla(var(--h),100%,55%,.1)}
.score-pill .sp-name{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase}
.score-pill .sp-val{font-size:20px;font-family:var(--ff-serif);color:#fff;margin-top:2px}

/* ═══ TIC TAC TOE ═══ */
.ttt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.ttt-cell{aspect-ratio:1;border-radius:16px;background:var(--g1);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:44px;font-family:var(--ff-serif);transition:var(--t)}
.ttt-cell.playable:hover{background:var(--g2);border-color:var(--accent)}
.ttt-cell.x{color:var(--accent-l)}
.ttt-cell.o{color:#ff9ec7}
.ttt-cell.win{background:linear-gradient(135deg,rgba(52,211,153,.25),rgba(52,211,153,.05));border-color:var(--green)}

/* ═══ TRUTH OR DARE ═══ */
.tod-cat-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tod-cat-row::-webkit-scrollbar{height:0}
.tod-cat{flex-shrink:0;padding:8px 14px;border-radius:20px;background:var(--g1);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--text2)}
.tod-cat.sel{background:linear-gradient(135deg,var(--accent2),var(--accent2-d));color:#fff;border-color:transparent}
.tod-wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 0}
.tod-spin-btn{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent2-d));border:4px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;box-shadow:0 12px 40px var(--accent2-glow)}
.tod-spin-btn.spinning{animation:spin828 .9s linear infinite}
@keyframes spin828{to{transform:rotate(360deg)}}
.tod-card{background:linear-gradient(155deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid var(--border2);border-radius:22px;padding:26px 20px;text-align:center;position:relative}
.tod-card-type{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent2);margin-bottom:10px}
.tod-card-text{font-family:var(--ff-serif);font-size:19px;color:#fff;line-height:1.5}
.tod-reactions{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.tod-react-btn{width:36px;height:36px;border-radius:50%;background:var(--g2);border:1px solid var(--border);font-size:16px}
.tod-float-emoji{position:fixed;font-size:34px;z-index:9997;animation:todfloat 2s ease forwards;pointer-events:none}
@keyframes todfloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-160px) scale(1.6)}}

/* ═══ LUDO ═══ */
.ludo-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.ludo-board{position:relative;width:min(88vw,340px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.04),rgba(0,0,0,.15));border:1px solid var(--border2)}
.ludo-home-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;height:26%;border-radius:50%;background:linear-gradient(135deg,var(--gold),#e08a00);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 30px var(--gold-glow)}
.ludo-cell{position:absolute;width:6.5%;height:6.5%;border-radius:50%;background:var(--g2);border:1px solid var(--border);transform:translate(-50%,-50%)}
.ludo-cell.safe{background:rgba(255,201,74,.25);border-color:rgba(255,201,74,.5)}
.ludo-token{position:absolute;width:8%;height:8%;border-radius:50%;border:2px solid rgba(255,255,255,.7);transform:translate(-50%,-50%);z-index:3;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.5);transition:left .4s cubic-bezier(.4,0,.2,1),top .4s cubic-bezier(.4,0,.2,1)}
.ludo-base-row{display:flex;gap:18px}
.ludo-base{display:flex;gap:8px;padding:10px 14px;border-radius:16px;background:var(--g1);border:1px solid var(--border)}
.ludo-base-token{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.ludo-dice{width:64px;height:64px;border-radius:16px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:var(--t)}
.ludo-dice.rolling{animation:dshake .5s ease}
@keyframes dshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}

/* ═══ DRAW & GUESS ═══ */
.dw-wrap{display:flex;flex-direction:column;height:100%}
.dw-toolbar{display:flex;gap:8px;padding:9px 12px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
.dw-color{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;flex-shrink:0;transition:var(--t)}
.dw-color.sel{border-color:#fff;transform:scale(1.2)}
.dw-canvas-wrap{flex:1;position:relative;overflow:hidden;background:#fff;min-height:220px}
#dwCanvas{width:100%;height:100%;touch-action:none;cursor:crosshair}
.dw-tool-btn{width:32px;height:32px;border-radius:9px;background:var(--g2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.dw-guess-banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;backdrop-filter:blur(8px);z-index:5}
.dw-guess-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0}
.dw-guess-in{flex:1;padding:11px 14px;border-radius:13px;background:var(--g2);border:1px solid var(--border2);color:#fff;font-size:13px}
.dw-word-reveal{font-size:11px;color:var(--gold);font-weight:800;padding:6px 12px}

/* ═══ MEMORY MATCH ═══ */
.mm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:0 auto}

/* ═══════════════════════════════════════════════════════
   SOUND ENGINE
═══════════════════════════════════════════════════════ */
const Snd = (function(){
  let ctx = null;
  function ac(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  function beep(freq, start, dur, type, vol){
    const c = ac(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.0001, c.currentTime+start);
    g.gain.exponentialRampToValueAtTime(vol||0.28, c.currentTime+start+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+start+dur);
    o.start(c.currentTime+start); o.stop(c.currentTime+start+dur+0.02);
  }
  return {
    click(){ beep(720,0,.06,'sine',.18); },
    tap(){ beep(500,0,.05,'triangle',.15); },
    success(){ beep(523,0,.1,'sine',.22); beep(659,.09,.12,'sine',.22); beep(784,.18,.18,'sine',.24); },
    fail(){ beep(220,0,.14,'sawtooth',.18); beep(160,.1,.18,'sawtooth',.16); },
    coin(){ beep(988,0,.08,'square',.14); beep(1318,.06,.1,'square',.14); },
    levelup(){ [523,659,784,1046,1318].forEach((f,i)=>beep(f,i*.08,.16,'sine',.2)); },
    place(){ beep(400,0,.08,'triangle',.2); beep(600,.05,.08,'triangle',.16); },
    dice(){ beep(300,0,.1,'square',.12); }
  };
})();

function toast(msg,dur){ const t=document.getElementById('gToast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),dur||2600); }

}

const LOCAL_KEY = 'us_games_profiles_v2';
function defaultProfile(){ return { xp:0, coins:120, favorites:[], history:{}, lastPlayDate:'', streakDays:0 }; }
const GameCore = {
  profiles:{u1:defaultProfile(),u2:defaultProfile()},
  loadLocal(){ try{ const raw=localStorage.getItem(LOCAL_KEY+'_'+ID.coupleId); if(raw) Object.assign(this.profiles, JSON.parse(raw)); }catch(e){} },
  saveLocal(){ try{ localStorage.setItem(LOCAL_KEY+'_'+ID.coupleId, JSON.stringify(this.profiles)); }catch(e){} },
  async loadCloud(){
    if(!sb) return;
    try{
      const {data,error} = await sb.from('games_profiles').select('*').eq('couple_id',ID.coupleId).maybeSingle();
      if(!error && data){ if(data.u1) this.profiles.u1={...defaultProfile(),...data.u1}; if(data.u2) this.profiles.u2={...defaultProfile(),...data.u2}; }
    }catch(e){ console.warn('games_profiles load failed:', e.message); }
  },
  saveTimer:null,
  saveCloud(){
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(async ()=>{
      this.saveLocal();
      if(!sb) return;
      try{ await sb.from('games_profiles').upsert({couple_id:ID.coupleId,u1:this.profiles.u1,u2:this.profiles.u2,updated_at:new Date().toISOString()},{onConflict:'couple_id'}); }

  me(){ return this.profiles[myKey]; },
  pt(){ return this.profiles[ptKey]; },
  level(xp){ return Math.floor(Math.sqrt(Math.max(0,xp)/28))+1; },
  xpForLevel(lv){ return Math.pow(lv-1,2)*28; },
  addXP(n){
    const p=this.me(); const before=this.level(p.xp); p.xp+=n; const after=this.level(p.xp);
    this.touchStreak(); this.saveCloud(); Hub.refreshRankCards();
    if(document.getElementById('goXpChip')) document.getElementById('goXpChip').textContent='✨ '+p.xp+' XP';
    if(after>before){ setTimeout(()=>showReward('🏆','Level Up!',['Level '+after]),400); }
    return after>before;
  },
  addCoins(n){ this.me().coins=Math.max(0,this.me().coins+n); this.saveCloud(); Hub.refreshRankCards(); Snd.coin(); },
  touchStreak(){
    const p=this.me(); const t=todayStr();
    if(p.lastPlayDate===t) return;
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);

/* ═══════════════════════════════════════════════════════
   REALTIME SYNC LAYER — Supabase channel (broadcast) + table persistence
   Table: games_shared (couple_id text, game text, data jsonb, updated_at timestamptz,
   primary key (couple_id, game)) — same table used previously, kept as-is.
═══════════════════════════════════════════════════════ */
class GameChannel {
  constructor(gameKey){
    this.gameKey=gameKey; this.chanName='gm_'+ID.coupleId+'_'+gameKey;
    this.channel=null; this._onMsg=null; this._lsHandler=null;
  }
  async load(){
    if(sb){
      try{
        const {data,error} = await sb.from('games_shared').select('data').eq('couple_id',ID.coupleId).eq('game',this.gameKey).maybeSingle();
        if(!error && data) return data.data;
      }catch(e){ console.warn('games_shared load failed:', e.message); }
    }
    try{ const raw=localStorage.getItem('gm_local_'+this.chanName); if(raw) return JSON.parse(raw); }catch(e){}
    return null;
  }
  async persist(state){
    try{ localStorage.setItem('gm_local_'+this.chanName, JSON.stringify(state)); }catch(e){}
    if(sb){
      try{ await sb.from('games_shared').upsert({couple_id:ID.coupleId,game:this.gameKey,data:state,updated_at:new Date().toISOString()},{onConflict:'couple_id,game'}); }
      catch(e){ /* table may not exist — silently keep local-only */ }
    }
  }
  listen(onMsg){
    this._onMsg=onMsg;
    if(sb){
      this.channel = sb.channel(this.chanName, {config:{broadcast:{self:false}}});
      this.channel.on('broadcast',{event:'ev'},(p)=>onMsg(p.payload));
      this.channel.subscribe();
    }
    this._lsHandler = (e)=>{ if(e.key==='gm_bc_'+this.chanName && e.newValue){ try{ onMsg(JSON.parse(e.newValue).payload); }catch(er){} } };
    window.addEventListener('storage', this._lsHandler);
  }
  send(payload){
    if(this.channel){ try{ this.channel.send({type:'broadcast',event:'ev',payload}); }catch(e){} }
    try{ localStorage.setItem('gm_bc_'+this.chanName, JSON.stringify({t:Date.now(),payload})); }catch(e){}
  }
  close(){ if(this.channel && sb) sb.removeChannel(this.channel); if(this._lsHandler) window.removeEventListener('storage',this._lsHandler); }
}

/* presence — who's playing what right now */
let presenceChan=null, partnerPresence={game:null,online:false};
function initPresence(){
  if(!sb) return;
  presenceChan = sb.channel('presence_'+ID.coupleId, {config:{presence:{key:ID.role}}});
  presenceChan.on('presence',{event:'sync'},()=>{
    const st = presenceChan.presenceState();
    let found=null;
    Object.keys(st).forEach(k=>{ if(k!==ID.role && st[k] && st[k][0]) found=st[k][0]; });
    partnerPresence = found ? {game:found.game||null,online:true} : {game:null,online:false};
    Hub.refreshRankCards();
  });
  presenceChan.subscribe(async (status)=>{ if(status==='SUBSCRIBED'){ await presenceChan.track({game:null,ts:Date.now()}); } });
}
function setPresenceGame(gid){ if(presenceChan) presenceChan.track({game:gid,ts:Date.now()}).catch(()=>{}); }

/* ═══════════════════════════════════════════════════════
   FACE-TO-FACE VIDEO — reuses existing /api/call/turn-creds
   and /api/call/signal endpoints (same tables/infra as chat
   calls), tagged with a gameCtx so it never collides with a
   real chat call happening at the same time.
═══════════════════════════════════════════════════════ */
const GameVideo = {
  pc:null, localStream:null, active:false, gameId:null,
  lastSignalId:0, pollTimer:null, muted:false, camOff:false, connected:false,

  async toggle(){
    if(this.active){ this.stop(); return; }
    this.gameId = Hub.activeGameId;
    if(!this.gameId) return;
    document.getElementById('goVidBtn').classList.add('on');
    document.getElementById('goVideo').classList.add('on');
    document.getElementById('gvStatus').style.display='block';
    document.getElementById('gvStatus').textContent='Requesting camera…';
    this.active = true;
    try{
      this.localStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
      document.getElementById('gvLocal').srcObject = this.localStream;
    }catch(e){
      toast('⚠️ Camera/mic permission needed for video');
      this.stop(); return;
    }
    document.getElementById('gvStatus').textContent = 'Connecting…';
    await this._initCursor();
    await this._setupPeer();
    this._pollLoop();
    // user1 always initiates the offer; user2 always waits — avoids glare
    if(ID.role==='user1') this._makeOffer();
  },

  async _iceServers(){
    try{
      const r = await fetch(API+'/api/call/turn-creds');
      const d = await r.json();
      return (d.iceServers && d.iceServers.length) ? d.iceServers : [{urls:'stun:stun.l.google.com:19302'}];
    }catch(e){ return [{urls:'stun:stun.l.google.com:19302'}]; }
  },

  async _setupPeer(){
    const iceServers = await this._iceServers();
    this.pc = new RTCPeerConnection({iceServers});
    this.localStream.getTracks().forEach(t=>this.pc.addTrack(t,this.localStream));
    this.pc.ontrack = (e)=>{
      const remoteVid = document.getElementById('gvRemote');
      if(remoteVid.srcObject !== e.streams[0]) remoteVid.srcObject = e.streams[0];
      document.getElementById('gvRemotePh').style.display='none';
      document.getElementById('gvStatus').style.display='none';
      this.connected = true;
    };
    this.pc.onicecandidate = (e)=>{ if(e.candidate) this._send({type:'ice',candidate:e.candidate}); };
    this.pc.onconnectionstatechange = ()=>{
      if(['failed','disconnected','closed'].includes(this.pc.connectionState) && this.active){
        document.getElementById('gvStatus').style.display='block';
        document.getElementById('gvStatus').textContent='Reconnecting…';
      }
    };
  },

  async _makeOffer(){
    const offer = await this.pc.createOffer();
    await this.pc.setLocalDescription(offer);
    this._send({type:'offer',sdp:offer});
  },

  async _send(msg){
    try{
      await fetch(API+'/api/call/signal',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({coupleId:ID.coupleId, role:ID.role, payload:{...msg, gameCtx:this.gameId}})
      });
    }catch(e){ /* signaling hiccup — the poll loop below will retry the flow */ }
  },

  async _initCursor(){
    try{
      const r = await fetch(API+'/api/call/signal/'+ID.coupleId+'?role='+otherRole, {cache:'no-store'});
      if(r.ok){ const rows = await r.json(); if(rows.length) this.lastSignalId = Math.max(...rows.map(x=>x.id)); }
    }catch(e){}
  },

  _pollLoop(){
    clearInterval(this.pollTimer);
    this.pollTimer = setInterval(async ()=>{
      if(!this.active) return;
      try{
        const r = await fetch(API+'/api/call/signal/'+ID.coupleId+'?role='+otherRole+'&after='+this.lastSignalId, {cache:'no-store'});
        if(!r.ok) return;
        const rows = await r.json();
        for(const row of rows){
          this.lastSignalId = Math.max(this.lastSignalId, row.id);
          const msg = row.payload;
          if(!msg || msg.gameCtx !== this.gameId) continue;
          if(msg.type==='offer' && this.pc){
            await this.pc.setRemoteDescription(msg.sdp);
            const answer = await this.pc.createAnswer();
            await this.pc.setLocalDescription(answer);
            this._send({type:'answer',sdp:answer});
          } else if(msg.type==='answer' && this.pc){
            if(!this.pc.currentRemoteDescription) await this.pc.setRemoteDescription(msg.sdp);
          } else if(msg.type==='ice' && this.pc){
            try{ await this.pc.addIceCandidate(msg.candidate); }catch(e){}
          } else if(msg.type==='end'){
            toast(ID.partnerName+' ended the video'); this.stop();
          }
        }
      }catch(e){}
    }, 900);
  },

  toggleMute(){
    if(!this.localStream) return;
    this.muted = !this.muted;
    this.localStream.getAudioTracks().forEach(t=>t.enabled=!this.muted);
    document.getElementById('gvMuteBtn').classList.toggle('off',this.muted);
    document.getElementById('gvMuteBtn').textContent = this.muted?'🔇':'🎤';
  },
  toggleCam(){
    if(!this.localStream) return;
    this.camOff = !this.camOff;
    this.localStream.getVideoTracks().forEach(t=>t.enabled=!this.camOff);
    document.getElementById('gvCamBtn').classList.toggle('off',this.camOff);
    document.getElementById('gvCamBtn').textContent = this.camOff?'📷':'📷';
  },
  stop(silent){
    if(this.active && !silent) this._send({type:'end'});
    this.active=false; this.connected=false;
    clearInterval(this.pollTimer); this.pollTimer=null;
    if(this.pc){ try{ this.pc.close(); }catch(e){} this.pc=null; }
    if(this.localStream){ this.localStream.getTracks().forEach(t=>t.stop()); this.localStream=null; }
    const rv=document.getElementById('gvRemote'), lv=document.getElementById('gvLocal');
    if(rv) rv.srcObject=null; if(lv) lv.srcObject=null;
    const ph=document.getElementById('gvRemotePh'); if(ph) ph.style.display='flex';
    const btn=document.getElementById('goVidBtn'); if(btn) btn.classList.remove('on');
    const panel=document.getElementById('goVideo'); if(panel) panel.classList.remove('on');
  }
};

const Hub = {

  async init(){
    GameCore.loadLocal();
    await GameCore.loadCloud();
    initPresence();
    this.render();
    this.refreshRankCards();
  },
  render(){
    const el=document.getElementById('hub');
    el.innerHTML = `
      <div class="hub-hero">

      <div class="hub-sec-title"><span>🎮 Games</span><div class="line"></div></div>
      <div class="games-grid" id="gamesGrid"></div>
    `;
    this.renderGameCards();
  },
  renderGameCards(){

    const favs=GameCore.me().favorites;
    grid.innerHTML = GAMES.map(g=>{
      const hist=GameCore.me().history[g.id];

        <div class="gcard-art" style="background:${g.grad}">

          <div class="gfav ${isFav?'on':''}" onclick="event.stopPropagation();Hub.toggleFav('${g.id}',this)">${isFav?'❤️':'🤍'}</div>
          ${live?`<div class="gcard-live"><span class="dot" style="width:5px;height:5px;border-radius:50%;background:#7cffcf;animation:blk 1.2s infinite"></span>${esc(ID.partnerName)} is playing</div>`:''}
        </div>
        <div class="gcard-body">
          <div class="gcard-title">${g.title}</div>

/* ═══════════════════════════════════════════════════════
   GAME 1 — TIC TAC TOE
═══════════════════════════════════════════════════════ */
const TTT_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const TTT = {
  chan:null, state:null,
  async open(body){
    this.chan = new GameChannel('ttt');
    let st = await this.chan.load();
    if(!st) st = {board:Array(9).fill(null), turn:'user1', winner:null, line:null, scores:{user1:0,user2:0}};
    this.state = st;
    this.chan.listen(p=>{ if(p.type==='sync'){ this.state=p.state; this.render(); } });
    this.render();
  },
  close(){ if(this.chan) this.chan.close(); },
  sync(){ this.chan.send({type:'sync',state:this.state}); this.chan.persist(this.state); },
  mySymbol(){ return ID.role==='user1' ? 'X' : 'O'; },
  play(i){
    if(this.state.winner || this.state.board[i] || this.state.turn!==ID.role) return;
    this.state.board[i]=this.mySymbol();
    const win=this.checkWin();
    if(win){
      this.state.winner=ID.role; this.state.line=win;
      this.state.scores[ID.role]=(this.state.scores[ID.role]||0)+1;
      GameCore.addXP(8); GameCore.addCoins(5); Snd.success();
      setTimeout(()=>showReward('🏆','You won this round!',['+8 XP','+5 🪙']),300);
    } else if(this.state.board.every(c=>c)){
      this.state.winner='draw'; Snd.tap();
    } else {
      this.state.turn = this.state.turn==='user1'?'user2':'user1';
      Snd.tap();
    }
    this.sync(); this.render();
  },
  checkWin(){
    const b=this.state.board;
    for(const line of TTT_LINES){ const [a,c,d]=line; if(b[a] && b[a]===b[c] && b[a]===b[d]) return line; }
    return null;
  },
  restart(){ this.state.board=Array(9).fill(null); this.state.turn='user1'; this.state.winner=null; this.state.line=null; this.sync(); this.render(); Snd.tap(); },
  render(){
    const body=document.getElementById('goBody'); if(!body) return;
    const s=this.state, mySym=this.mySymbol(), myTurn = s.turn===ID.role && !s.winner;
    body.innerHTML = `
      <div class="score-bar">
        <div class="score-pill ${ID.role==='user1'?'mine':''}"><div class="sp-name">${esc(ID.myName)} (${mySym})</div><div class="sp-val">${s.scores.user1||0}</div></div>
        <div class="score-pill ${ID.role==='user2'?'mine':''}"><div class="sp-name">${esc(ID.partnerName)} (${ID.role==='user1'?'O':'X'})</div><div class="sp-val">${s.scores.user2||0}</div></div>
      </div>
      <div class="turn-bar ${myTurn?'mine':''}">${s.winner ? (s.winner==='draw'?'🤝 It is a draw!' : (s.winner===ID.role?'🎉 You won!':esc(ID.partnerName)+' won this round')) : (myTurn?'✨ Your turn':esc(ID.partnerName)+' is turn…')}</div>
      <div class="ttt-board">
        ${s.board.map((c,i)=>`<div class="ttt-cell ${c?c.toLowerCase():''} ${!c&&myTurn?'playable':''} ${s.line&&s.line.includes(i)?'win':''}" onclick="TTT.play(${i})">${c||''}</div>`).join('')}
      </div>
      <div style="text-align:center;margin-top:16px">${s.winner?'<button class="btn btn-accent" onclick="TTT.restart()">🔄 Play Again</button>':''}</div>
    `;
  }
};

/* ═══════════════════════════════════════════════════════
   GAME 2 — REAL LUDO (2-player, real dice, safe cells,
   capturing, home stretch — simplified circular board)
═══════════════════════════════════════════════════════ */
const LUDO_COLORS = {user1:'#ef4444', user2:'#22c55e'};
const LUDO_NAMES  = {user1:'Red', user2:'Green'};
const LUDO_START = {user1:0, user2:26};
const LUDO_SAFE = [0,8,13,21,26,34,39,47];
const Ludo = {
  chan:null, state:null, rolling:false,
  async open(body){
    this.chan = new GameChannel('ludo');
    let st = await this.chan.load();
    if(!st) st = this.fresh();
    this.state = st;
    this.chan.listen(p=>{ if(p.type==='sync'){ this.state=p.state; this.render(); } });
    this.render();
  },
  close(){ if(this.chan) this.chan.close(); },
  sync(){ this.chan.send({type:'sync',state:this.state}); this.chan.persist(this.state); },
  fresh(){ return { tokens:{user1:[-1,-1,-1,-1],user2:[-1,-1,-1,-1]}, turn:'user1', dice:null, winner:null }; },
  restart(){ this.state=this.fresh(); this.sync(); this.render(); },
  movable(role,d){
    const out=[];
    this.state.tokens[role].forEach((pos,i)=>{
      if(pos===57) return;
      if(pos===-1){ if(d===6) out.push(i); return; }
      if(pos+d<=57) out.push(i);
    });
    return out;
  },
  roll(){
    if(this.state.winner || this.state.turn!==ID.role || this.state.dice!=null) return;
    this.rolling=true; this.render();
    Snd.dice();
    setTimeout(()=>{
      const d = 1+Math.floor(Math.random()*6);
      this.state.dice = d;
      this.rolling=false;
      const mv = this.movable(ID.role,d);
      this.sync(); this.render();
      if(!mv.length){
        toast(d===6?'Rolled a 6 but no legal move':'No legal move — turn passes');
        setTimeout(()=>{ this.state.dice=null; this.state.turn = d===6?ID.role:otherRole; this.sync(); this.render(); },1000);
      }
    },550);
  },
  moveToken(i){
    if(this.state.winner || this.state.turn!==ID.role || this.state.dice==null) return;
    const d=this.state.dice, role=ID.role;
    const mv=this.movable(role,d); if(!mv.includes(i)) return;
    const tokens=this.state.tokens[role];
    const pos=tokens[i];
    const newPos = pos===-1 ? 0 : pos+d;
    tokens[i]=newPos;
    Snd.place();
    // capture check on global ring (not home stretch)
    if(newPos>=0 && newPos<=50){
      const globalIdx=(LUDO_START[role]+newPos)%52;
      if(!LUDO_SAFE.includes(globalIdx)){
        const opp = role==='user1'?'user2':'user1';
        this.state.tokens[opp].forEach((op,oi)=>{
          if(op>=0 && op<=50 && (LUDO_START[opp]+op)%52===globalIdx){
            this.state.tokens[opp][oi]=-1;
            toast('🎯 Captured '+ID.partnerName+'\'s token!'); GameCore.addCoins(5);
          }
        });
      }
    }
    if(newPos===57) toast('🏠 A token made it home!');
    const allHome = tokens.every(t=>t===57);
    if(allHome){
      this.state.winner=role;
      GameCore.addXP(15); GameCore.addCoins(10); Snd.success();
      setTimeout(()=>showReward('👑','Ludo Champion!',['+15 XP','+10 🪙']),300);
    } else {
      this.state.turn = d===6 ? role : (role==='user1'?'user2':'user1');
    }
    this.state.dice=null;
    this.sync(); this.render();
  },
  // map global ring index (0..51) -> {x,y} percent on circular board
  ringXY(gi,R){ const ang=(gi/52)*2*Math.PI - Math.PI/2; return {x:50+R*Math.cos(ang), y:50+R*Math.sin(ang)}; },
  render(){
    const body=document.getElementById('goBody'); if(!body) return;
    const s=this.state, myTurn=s.turn===ID.role && !s.winner;
    const mv = s.dice!=null ? this.movable(ID.role,s.dice) : [];
    let cellsHtml='', tokensHtml='';
    for(let gi=0; gi<52; gi++){
      const {x,y}=this.ringXY(gi,42);
      cellsHtml += `<div class="ludo-cell ${LUDO_SAFE.includes(gi)?'safe':''}" style="left:${x}%;top:${y}%"></div>`;
    }
    ['user1','user2'].forEach(role=>{
      const entryGlobal=(LUDO_START[role]+50)%52; // last ring cell before turning home
      const entryAng=(LUDO_START[role]/52)*2*Math.PI - Math.PI/2;
      for(let h=0;h<6;h++){
        const R=42-(h+1)*6.2;
        const x=50+R*Math.cos(entryAng), y=50+R*Math.sin(entryAng);
        cellsHtml += `<div class="ludo-cell" style="left:${x}%;top:${y}%;background:${LUDO_COLORS[role]}55"></div>`;
      }
      s.tokens[role].forEach((pos,i)=>{
        let x,y;
        if(pos===-1) return; // shown in base row, not on board
        else if(pos<=50){ const gi=(LUDO_START[role]+pos)%52; ({x,y}=this.ringXY(gi,42)); }
        else if(pos<=56){ const h=pos-51; const R=42-(h+1)*6.2; x=50+R*Math.cos(entryAng); y=50+R*Math.sin(entryAng); }
        else { x=50; y=50; }
        const canMove = role===ID.role && mv.includes(i);
        tokensHtml += `<div class="ludo-token ${canMove?'playable':''}" style="left:${x}%;top:${y}%;background:${LUDO_COLORS[role]};${canMove?'box-shadow:0 0 0 4px rgba(255,255,255,.5)':''}" onclick="${canMove?`Ludo.moveToken(${i})`:''}">${i+1}</div>`;
      });
    });
    const baseRow=(role)=> s.tokens[role].map((pos,i)=>{
      if(pos!==-1) return '';
      const canExit = role===ID.role && mv.includes(i);
      return `<div class="ludo-base-token" style="background:${LUDO_COLORS[role]};${canExit?'box-shadow:0 0 0 3px #fff;cursor:pointer':''}" onclick="${canExit?`Ludo.moveToken(${i})`:''}">${i+1}</div>`;
    }).join('');
    body.innerHTML = `
      <div class="turn-bar ${myTurn?'mine':''}">${s.winner? (s.winner===ID.role?'👑 You won!':esc(ID.partnerName)+' won this game') : (myTurn?'✨ Your turn — roll the dice':esc(ID.partnerName)+' is playing…')}</div>
      <div class="ludo-wrap">
        <div class="ludo-board" id="ludoBoard">
          ${cellsHtml}
          <div class="ludo-home-hub">🏠</div>
          ${tokensHtml}
        </div>
        <div class="ludo-dice ${this.rolling?'rolling':''}" onclick="Ludo.roll()" style="${myTurn && s.dice==null && !this.rolling ? 'cursor:pointer;box-shadow:0 0 0 4px var(--accent-glow)':''}">${this.rolling?'🎲':(s.dice||'🎲')}</div>
        <div class="ludo-base-row">
          <div class="ludo-base">${baseRow('user1')}</div>
          <div class="ludo-base">${baseRow('user2')}</div>
        </div>
        <div style="font-size:11px;color:var(--text2);text-align:center">🔴 ${esc(ID.role==='user1'?ID.myName:ID.partnerName)} · 🟢 ${esc(ID.role==='user2'?ID.myName:ID.partnerName)} — roll a 6 to leave base, land exactly on 57 to get home</div>
        ${s.winner?'<button class="btn btn-accent" onclick="Ludo.restart()">🔄 New Game</button>':''}
      </div>
    `;
  }
};

/* ═══════════════════════════════════════════════════════

const TOD_DATA = {
  romantic:{truths:['What made you fall for me?','What\'s your favorite memory of us?','When did you know I was the one?'],dares:['Give a 20-second compliment','Send a voice note saying why you love me','Recreate our first date moment']},
  cute:{truths:['What\'s my most adorable habit?','What nickname would you give me?','What\'s a tiny thing I do that makes you smile?'],dares:['Do your best impression of me','Send the last selfie you took','Draw me in 30 seconds']},
  funny:{truths:['Weirdest dream you\'ve had about me?','Funniest thing that happened on a date?','What\'s my most annoying habit?'],dares:['Talk in an accent for 2 minutes','Do 10 jumping jacks right now','Sing our song badly on purpose']},
  deep:{truths:['What\'s a fear you haven\'t told me?','What do you want us to work on together?','What does forever look like to you?'],dares:['Share a goal you\'ve been scared to say out loud','Write down one thing you appreciate about me','Talk about a memory that shaped you']},
  hot:{truths:['What\'s something you find attractive about me?','What outfit of mine do you love most?','What\'s a compliment you love hearing?'],dares:['Send a flirty message','Give a slow wink on camera','Whisper something sweet']},
  adventure:{truths:['Dream trip we should take together?','Craziest thing you\'d do with me?','A bucket-list thing for us?'],dares:['Plan a mini adventure for next weekend','Suggest a new food to try together','Pick our next movie night pick']}
};
const TOD_PENALTIES=['Do 10 pushups 💪','Send a silly selfie 🤳','Sing happy birthday 🎂','Speak in a funny voice for 1 min 🗣️'];
const TOD_CATS=[['romantic','💕 Romantic'],['cute','🥰 Cute'],['funny','😂 Funny'],['deep','💭 Deep'],['hot','🔥 Hot'],['adventure','🗺️ Adventure']];
const TOD = {
  chan:null, state:null, category:'romantic', timerInt:null,
  async open(body){
    this.chan = new GameChannel('tod');
    let st = await this.chan.load();
    if(!st) st = {turn:'user1', streak:0, current:null, category:'romantic'};
    this.state = st; this.category=st.category||'romantic';
    this.chan.listen(p=>{ if(p.type==='sync'){ this.state=p.state; this.category=this.state.category; this.render(); } });
    this.render();
  },
  close(){ clearInterval(this.timerInt); if(this.chan) this.chan.close(); },
  sync(){ this.chan.send({type:'sync',state:this.state}); this.chan.persist(this.state); },
  setCategory(c){ this.category=c; this.state.category=c; this.sync(); this.render(); Snd.tap(); },
  spin(){
    if(this.state.turn!==ID.role || this.state.current) return;
    Snd.tap();
    const pool = TOD_DATA[this.category];
    const isT = Math.random()<0.5;
    const text = rand(isT?pool.truths:pool.dares);
    this.state.current = {type:isT?'truth':'dare', text};
    this.sync(); this.render(); this.startCardTimer();
  },
  startCardTimer(){
    clearInterval(this.timerInt); let secs=45;
    this.timerInt=setInterval(()=>{
      secs--; if(secs<=0){ clearInterval(this.timerInt); this.penalty(); }
    },1000);
  },
  speakCard(){
    if(!('speechSynthesis' in window)){ toast('Voice not supported on this browser'); return; }
    const u=new SpeechSynthesisUtterance(this.state.current.text); u.rate=0.95;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  },
  react(emoji){ this.chan.send({type:'react',emoji}); this.floatEmoji(emoji); },
  floatEmoji(emoji){
    const el=document.createElement('div'); el.className='tod-float-emoji'; el.textContent=emoji;
    el.style.left=(40+Math.random()*20)+'vw'; el.style.bottom='120px';
    document.body.appendChild(el); setTimeout(()=>el.remove(),2000);
  },
  completeCard(){
    clearInterval(this.timerInt);
    this.state.streak++; this.state.current=null;
    this.state.turn = this.state.turn==='user1'?'user2':'user1';
    GameCore.addXP(10); GameCore.addCoins(4); Snd.success();
    this.sync(); this.render();
  },
  penalty(){
    clearInterval(this.timerInt);
    const pen = rand(TOD_PENALTIES);
    Snd.fail(); this.state.streak=0; this.state.current=null;
    this.state.turn = this.state.turn==='user1'?'user2':'user1';
    showReward('😅','Penalty Time!',[pen]);
    this.sync(); this.render();
  },
  render(){
    const body=document.getElementById('goBody'); if(!body) return;
    const s=this.state, myTurn=s.turn===ID.role;
    body.innerHTML = `
      <div class="turn-bar ${myTurn?'mine':''}">🔥 Streak: ${s.streak} &nbsp;·&nbsp; ${myTurn?'✨ Your turn to spin':esc(ID.partnerName)+'\'s turn…'}</div>
      <div class="tod-cat-row">${TOD_CATS.map(([id,label])=>`<button class="tod-cat ${this.category===id?'sel':''}" onclick="TOD.setCategory('${id}')">${label}</button>`).join('')}</div>
      ${s.current ? `
      <div class="tod-card">
        <div class="tod-card-type">${s.current.type==='truth'?'💬 TRUTH':'⚡ DARE'}</div>
        <div class="tod-card-text">${esc(s.current.text)}</div>
        <div class="tod-reactions">${['😂','😍','😳','🔥','👏'].map(e=>`<button class="tod-react-btn" onclick="TOD.react('${e}')">${e}</button>`).join('')}</div>
        <div style="display:flex;gap:8px;margin-top:14px;justify-content:center">
          <button class="btn btn-glass btn-sm" onclick="TOD.speakCard()">🔊 Read</button>
          ${myTurn?`<button class="btn btn-glass btn-sm" onclick="TOD.penalty()">😅 Skip</button><button class="btn btn-pink btn-sm" onclick="TOD.completeCard()">✅ Done!</button>`:''}
        </div>
      </div>` : `
      <div class="tod-wheel-wrap">
        <button class="tod-spin-btn" ${!myTurn?'disabled':''} onclick="TOD.spin()">SPIN 🎡</button>
        <div style="font-size:12px;color:var(--text2)">${myTurn?'Tap to reveal your truth or dare':'Waiting for '+esc(ID.partnerName)+'…'}</div>
      </div>`}
    `;
  }
};

/* ═══════════════════════════════════════════════════════

const DRAW_WORDS=['cat','pizza','rainbow','guitar','heart','tree','sun','umbrella','robot','castle','fish','flower','moon','car','house','butterfly','ice cream','star','crown','balloon','shoe','clock','book','key','cloud','boat','apple','kite','snowman','rocket'];
const DW_COLORS=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ffffff','#000000'];
const Draw = {
  chan:null, state:null, canvas:null, ctx:null, drawing:false, color:'#ef4444', lastPt:null,
  async open(body){
    this.chan = new GameChannel('draw');
    let st = await this.chan.load();
    if(!st) st = {drawer:'user1', word:rand(DRAW_WORDS), strokes:[], guesses:[], scores:{user1:0,user2:0}, round:1};
    this.state = st;
    this.chan.listen(p=>{
      if(p.type==='sync'){ this.state=p.state; this.render(); this.redrawAll(); }
      else if(p.type==='stroke'){ this.state.strokes.push(p.stroke); this.drawSeg(p.stroke); }
      else if(p.type==='clear'){ this.state.strokes=[]; this.clearCanvas(); }
    });
    this.render();
  },
  close(){ if(this.chan) this.chan.close(); },
  sync(){ this.chan.send({type:'sync',state:this.state}); this.chan.persist(this.state); },
  isDrawer(){ return this.state.drawer===ID.role; },
  setupCanvas(){
    this.canvas=document.getElementById('dwCanvas'); if(!this.canvas) return;
    const wrap=this.canvas.parentElement;
    this.canvas.width=wrap.clientWidth; this.canvas.height=wrap.clientHeight;
    this.ctx=this.canvas.getContext('2d');
    this.ctx.lineCap='round'; this.ctx.lineJoin='round'; this.ctx.lineWidth=5;
    this.redrawAll();
    const getPt=(e)=>{ const r=this.canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/r.width, y:(t.clientY-r.top)/r.height}; };
    const start=(e)=>{ if(!this.isDrawer()) return; e.preventDefault(); this.drawing=true; this.lastPt=getPt(e); };
    const move=(e)=>{
      if(!this.isDrawer()||!this.drawing) return; e.preventDefault();
      const p=getPt(e); const stroke={x0:this.lastPt.x,y0:this.lastPt.y,x1:p.x,y1:p.y,color:this.color};
      this.drawSeg(stroke); this.state.strokes.push(stroke); this.chan.send({type:'stroke',stroke}); this.lastPt=p;
    };
    const end=()=>{ this.drawing=false; if(this.isDrawer()) this.chan.persist(this.state); };
    this.canvas.onmousedown=start; this.canvas.onmousemove=move; window.onmouseup=end;
    this.canvas.ontouchstart=start; this.canvas.ontouchmove=move; this.canvas.ontouchend=end;
  },
  drawSeg(s){
    if(!this.ctx) return;
    this.ctx.strokeStyle=s.color; this.ctx.beginPath();
    this.ctx.moveTo(s.x0*this.canvas.width, s.y0*this.canvas.height);
    this.ctx.lineTo(s.x1*this.canvas.width, s.y1*this.canvas.height);
    this.ctx.stroke();
  },
  clearCanvas(){ if(this.ctx) this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height); },
  redrawAll(){ this.clearCanvas(); (this.state.strokes||[]).forEach(s=>this.drawSeg(s)); },
  clear(){ if(!this.isDrawer()) return; this.state.strokes=[]; this.chan.send({type:'clear'}); this.clearCanvas(); this.chan.persist(this.state); },
  newWord(){ if(!this.isDrawer()) return; this.state.word=rand(DRAW_WORDS); this.state.strokes=[]; this.sync(); this.clearCanvas(); toast('New word! ✏️'); },
  guess(){
    const inp=document.getElementById('dwGuessIn'); const val=(inp.value||'').trim().toLowerCase();
    if(!val) return; inp.value='';
    if(val===this.state.word.toLowerCase()){
      GameCore.addXP(20); GameCore.addCoins(8); Snd.success();
      this.state.scores[ID.role]=(this.state.scores[ID.role]||0)+1;
      showReward('🎉','Correct guess!',['The word was “'+this.state.word+'”','+20 XP']);
      this.state.drawer = this.state.drawer==='user1'?'user2':'user1';
      this.state.word = rand(DRAW_WORDS); this.state.strokes=[]; this.state.round++;
      this.sync(); this.clearCanvas(); this.render();
    } else { toast('❌ Not quite — try again!'); Snd.fail(); }
  },
  render(){
    const body=document.getElementById('goBody'); if(!body) return;
    body.className='gobody nopad';
    const drawer=this.isDrawer();
    body.innerHTML = `
      <div class="dw-wrap" style="height:100%">
        <div style="padding:10px 12px 0"><div class="score-bar" style="margin-bottom:8px">
          <div class="score-pill ${ID.role==='user1'?'mine':''}"><div class="sp-name">${esc(ID.myName)}</div><div class="sp-val">${this.state.scores.user1||0}</div></div>
          <div class="score-pill ${ID.role==='user2'?'mine':''}"><div class="sp-name">${esc(ID.partnerName)}</div><div class="sp-val">${this.state.scores.user2||0}</div></div>
        </div></div>
        <div class="dw-toolbar">
          ${drawer ? DW_COLORS.map(c=>`<div class="dw-color ${this.color===c?'sel':''}" style="background:${c}" onclick="Draw.pickColor('${c}')"></div>`).join('') : `<div class="dw-word-reveal">🤔 ${esc(ID.partnerName)} is drawing — guess below!</div>`}
          ${drawer?`<button class="dw-tool-btn" onclick="Draw.clear()" title="Clear">🗑️</button><button class="dw-tool-btn" onclick="Draw.newWord()" title="New word">🔀</button>`:''}
        </div>
        <div class="dw-canvas-wrap">
          ${drawer?`<div class="dw-guess-banner">✏️ Draw: <strong>${esc(this.state.word)}</strong></div>`:''}
          <canvas id="dwCanvas"></canvas>
        </div>
        ${!drawer?`<div class="dw-guess-row"><input class="dw-guess-in" id="dwGuessIn" placeholder="Type your guess…" onkeydown="if(event.key==='Enter')Draw.guess()"><button class="btn btn-pink" onclick="Draw.guess()">Guess</button></div>`:''}
      </div>
    `;
    setTimeout(()=>this.setupCanvas(),30);
  },
  pickColor(c){ this.color=c; this.render(); setTimeout(()=>this.setupCanvas(),30); }
};

/* ═══════════════════════════════════════════════════════
   GAME 5 — MEMORY MATCH
═══════════════════════════════════════════════════════ */
const MM_EMOJIS=['❤️','🌟','🎈','🍕','🌙','🐶','🎵','🌈'];
const Memory = {
  chan:null, state:null, busy:false,
  async open(body){
    this.chan = new GameChannel('memory');
    let st = await this.chan.load();
    if(!st) st = this.fresh();
    this.state = st;
    this.chan.listen(p=>{ if(p.type==='sync'){ this.state=p.state; this.render(); } });
    this.render();
  },
  close(){ if(this.chan) this.chan.close(); },
  sync(){ this.chan.send({type:'sync',state:this.state}); this.chan.persist(this.state); },
  fresh(){
    let deck=[...MM_EMOJIS,...MM_EMOJIS].map((e,i)=>({id:i,emoji:e,matched:false}));
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
    return { cards:deck, flipped:[], turn:'user1', scores:{user1:0,user2:0}, winner:null };
  },
  restart(){ this.state=this.fresh(); this.sync(); this.render(); },
  flip(i){
    const s=this.state;
    if(s.winner || s.turn!==ID.role || this.busy) return;
    if(s.cards[i].matched || s.flipped.includes(i)) return;
    s.flipped.push(i); Snd.tap();
    this.sync(); this.render();
    if(s.flipped.length===2){
      this.busy=true;
      const [a,b]=s.flipped;
      setTimeout(()=>{
        if(s.cards[a].emoji===s.cards[b].emoji){
          s.cards[a].matched=true; s.cards[b].matched=true;
          s.scores[ID.role]=(s.scores[ID.role]||0)+1;
          GameCore.addXP(6); GameCore.addCoins(3); Snd.success();
          s.flipped=[];
          if(s.cards.every(c=>c.matched)){
            s.winner = s.scores.user1>=s.scores.user2 ? 'user1':'user2';
            if(s.scores.user1===s.scores.user2) s.winner='draw';
            setTimeout(()=>showReward('🧠','All pairs matched!',['Final: '+s.scores.user1+' - '+s.scores.user2]),300);
          }
        } else {
          Snd.fail(); s.flipped=[]; s.turn = s.turn==='user1'?'user2':'user1';
        }
        this.busy=false; this.sync(); this.render();
      },850);
    }
  },
  render(){
    const body=document.getElementById('goBody'); if(!body) return;
    const s=this.state, myTurn=s.turn===ID.role && !s.winner;
    body.innerHTML = `
      <div class="score-bar">
        <div class="score-pill ${ID.role==='user1'?'mine':''}"><div class="sp-name">${esc(ID.myName)}</div><div class="sp-val">${s.scores.user1||0}</div></div>
        <div class="score-pill ${ID.role==='user2'?'mine':''}"><div class="sp-name">${esc(ID.partnerName)}</div><div class="sp-val">${s.scores.user2||0}</div></div>
      </div>
      <div class="turn-bar ${myTurn?'mine':''}">${s.winner?(s.winner==='draw'?'🤝 It is a tie!':(s.winner===ID.role?'🎉 You won!':esc(ID.partnerName)+' won!')):(myTurn?'✨ Your turn — flip 2 cards':esc(ID.partnerName)+' is turn…')}</div>
      <div class="mm-grid">
        ${s.cards.map((c,i)=>{
          const shown = c.matched || s.flipped.includes(i);
          return `<div class="mm-card ${shown?(c.matched?'matched':'flipped'):''}" onclick="Memory.flip(${i})">${shown?c.emoji:''}</div>`;
        }).join('')}
      </div>
      <div style="text-align:center;margin-top:16px">${s.winner?'<button class="btn btn-accent" onclick="Memory.restart()">🔄 Play Again</button>':''}</div>
    `;
  }
};
