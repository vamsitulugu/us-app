};

/* ═══════════════════════════════════════════════════════
   GAME 4 — DRAW & GUESS
   The drawer now types their OWN word (with quick suggestion
   chips + voice input) instead of a random pick. Guesses are
   checked with a "best-effort detection engine": exact match →
   typo-tolerant match (Levenshtein) → plural/stem match →
   substring/compound match → semantic similarity via the free
   Datamuse API (synonyms + "means like"), so e.g. guessing
   "man"/"boy" for a drawn "human" still counts as correct.
═══════════════════════════════════════════════════════ */
const DRAW_WORDS=['cat','pizza','rainbow','guitar','heart','tree','sun','umbrella','robot','castle','fish','flower','moon','car','house','butterfly','ice cream','star','crown','balloon','shoe','clock','book','key','cloud','boat','apple','kite','snowman','rocket'];
const DW_COLORS=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ffffff','#000000'];
const DW_SIZES=[3,6,11];
const DW_ROUND_SECONDS=75;

function dwNormalize(s){ return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,''); }
function dwStem(s){ return s.replace(/(ies)$/,'y').replace(/(es|s)$/,''); }
function dwLevenshtein(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n];
}
// synonym/semantic cache so we don't hammer the API on repeated guesses in the same round
const dwSynCache = new Map();
async function dwRelatedWords(word){
  if(dwSynCache.has(word)) return dwSynCache.get(word);
  let pool=[];
  try{
    const [syn,ml] = await Promise.all([
      fetch(`https://api.datamuse.com/words?rel_syn=${encodeURIComponent(word)}&max=25`).then(r=>r.ok?r.json():[]).catch(()=>[]),
      fetch(`https://api.datamuse.com/words?ml=${encodeURIComponent(word)}&max=15`).then(r=>r.ok?r.json():[]).catch(()=>[])
    ]);
    pool = [...(syn||[]),...(ml||[])].map(x=>dwNormalize(x.word)).filter(Boolean);
  }catch(e){ /* offline or API unreachable — fall back to non-semantic checks only */ }
  dwSynCache.set(word,pool);
  return pool;
}
// Returns true if `guess` should count as a correct match for `target`.
async function dwCheckMatch(guess,target){
  const ng=dwNormalize(guess), nt=dwNormalize(target);
  if(!ng||!nt) return false;
  if(ng===nt) return true;
  if(dwStem(ng)===dwStem(nt)) return true;
  const maxLen=Math.max(ng.length,nt.length);
  if(maxLen>=4 && dwLevenshtein(ng,nt)<=Math.max(1,Math.floor(maxLen*0.25))) return true; // typo tolerance
  if(maxLen>=5 && (ng.includes(nt)||nt.includes(ng))) return true; // compound/substring (e.g. "icecream" vs "cream")
  // semantic similarity — check both directions since synonym lists aren't always symmetric
  const [targetPool,guessPool] = await Promise.all([dwRelatedWords(nt), dwRelatedWords(ng)]);
  if(targetPool.includes(ng) || guessPool.includes(nt)) return true;
  return false;
}

const Draw = {
  chan:null, state:null, canvas:null, ctx:null, drawing:false, checking:false,
  color:'#ef4444', size:6, mode:'pen', lastPt:null, strokeId:null, redoStack:[],
  timerTick:null, timerLeft:DW_ROUND_SECONDS, typingHideT:null, partnerTyping:false,
  async open(body){
    this.chan = new GameChannel('draw');
    let st = await this.chan.load();
    if(!st) st = this.fresh();
    if(!st.guessLog) st.guessLog=[];
    if(!st.roundStartedAt) st.roundStartedAt=Date.now();
    if(st.wordSet===undefined) st.wordSet = !!st.word; // backward-compat with older saved games
    this.state = st; this.redoStack=[];
    this.chan.listen(p=>{
      if(p.type==='sync'){ this.state=p.state; this.redoStack=[]; this.render(); this.redrawAll(); }
      else if(p.type==='stroke'){ this.state.strokes.push(p.stroke); if(p.stroke.mode==='fill') this.floodFillAt(p.stroke.x,p.stroke.y,p.stroke.color); else this.drawSeg(p.stroke); }
      else if(p.type==='clear'){ this.state.strokes=[]; this.clearCanvas(); }
      else if(p.type==='undo'){ this.state.strokes=p.strokes; this.redrawAll(); }
      else if(p.type==='typing'){ this.partnerTyping=true; clearTimeout(this.typingHideT); this.typingHideT=setTimeout(()=>{ this.partnerTyping=false; this.updateTypingUI(); },2200); this.updateTypingUI(); }
      else if(p.type==='guesslog'){ this.state.guessLog=p.log; this.renderGuessLog(); }
    });
    this.startTimer();
    this.render();
  },
  close(){ if(this.chan) this.chan.close(); clearInterval(this.timerTick); },
  sync(){ this.chan.send({type:'sync',state:this.state}); this.chan.persist(this.state); },
  fresh(){ return {drawer:'user1', word:'', wordSet:false, strokes:[], guessLog:[], scores:{user1:0,user2:0}, round:1, roundStartedAt:Date.now()}; },
  isDrawer(){ return this.state.drawer===ID.role; },
  startTimer(){
    clearInterval(this.timerTick);
    this.timerTick = setInterval(()=>{
      if(!this.state || !this.state.wordSet) return;
      const elapsed = Math.floor((Date.now()-(this.state.roundStartedAt||Date.now()))/1000);
      this.timerLeft = Math.max(0, DW_ROUND_SECONDS-elapsed);
      const fill=document.getElementById('dwTimerFill'); if(fill) fill.style.width=(this.timerLeft/DW_ROUND_SECONDS*100)+'%';
      const hint=document.getElementById('dwHintRow'); if(hint) hint.innerHTML=this.hintText(elapsed);
      if(this.timerLeft===0 && this.isDrawer()){
        toast('⏱️ Time\'s up — new round'); this.nextRound(false);
      }
    },1000);
  },
  hintText(elapsed){
    const w=this.state.word||'';
    if(this.isDrawer()||!w) return '';
    let blanks = w.split('').map(ch=>ch===' '?' ':'_').join(' ');
    if(elapsed>=30) blanks = w[0].toUpperCase()+blanks.slice(1);
    if(elapsed>=45) return blanks+`  (${w.length} letters)`;
    return blanks;
  },
  setupCanvas(){
    this.canvas=document.getElementById('dwCanvas'); if(!this.canvas) return;
    const wrap=this.canvas.parentElement;
    this.canvas.width=wrap.clientWidth; this.canvas.height=wrap.clientHeight;
    this.ctx=this.canvas.getContext('2d');
    this.ctx.lineCap='round'; this.ctx.lineJoin='round';
    this.redrawAll();
    const getPt=(e)=>{ const r=this.canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)/r.width, y:(t.clientY-r.top)/r.height}; };
    const start=(e)=>{
      if(!this.isDrawer()||!this.state.wordSet) return; e.preventDefault();
      if(this.mode==='fill'){
        const p=getPt(e);
        const fillItem={x:p.x,y:p.y,color:this.color,mode:'fill',sid:uid()};
        this.floodFillAt(p.x,p.y,this.color);
        this.state.strokes.push(fillItem); this.chan.send({type:'stroke',stroke:fillItem}); this.chan.persist(this.state);
        Snd.tap();
        return;
      }
      this.drawing=true; this.lastPt=getPt(e); this.strokeId=uid(); this.redoStack=[];
    };
    const move=(e)=>{
      if(!this.isDrawer()||!this.drawing||this.mode==='fill') return; e.preventDefault();
      const p=getPt(e);
      const stroke={x0:this.lastPt.x,y0:this.lastPt.y,x1:p.x,y1:p.y,color:this.color,size:this.size,mode:this.mode,sid:this.strokeId};
      this.drawSeg(stroke); this.state.strokes.push(stroke); this.chan.send({type:'stroke',stroke}); this.lastPt=p;
    };
    const end=()=>{ this.drawing=false; this.strokeId=null; if(this.isDrawer()) this.chan.persist(this.state); };
    this.canvas.onmousedown=start; this.canvas.onmousemove=move; window.onmouseup=end;
    this.canvas.ontouchstart=start; this.canvas.ontouchmove=move; this.canvas.ontouchend=end;
  },
  drawSeg(s){
    if(!this.ctx) return;
    this.ctx.save();
    if(s.mode==='eraser'){ this.ctx.globalCompositeOperation='destination-out'; this.ctx.strokeStyle='rgba(0,0,0,1)'; }
    else { this.ctx.globalCompositeOperation='source-over'; this.ctx.strokeStyle=s.color; this.ctx.globalAlpha = s.mode==='highlighter'?0.35:1; }
    this.ctx.lineWidth=(s.size||6)*(s.mode==='highlighter'?2.6:1);
    this.ctx.beginPath();
    this.ctx.moveTo(s.x0*this.canvas.width, s.y0*this.canvas.height);
    this.ctx.lineTo(s.x1*this.canvas.width, s.y1*this.canvas.height);
    this.ctx.stroke();
    this.ctx.restore();
  },
  hexToRgb(hex){
    if(hex==='#ffffff') return {r:255,g:255,b:255};
    if(hex==='#000000') return {r:0,g:0,b:0};
    const h=hex.replace('#','');
    return { r:parseInt(h.substring(0,2),16), g:parseInt(h.substring(2,4),16), b:parseInt(h.substring(4,6),16) };
  },
  floodFillAt(nx,ny,color){
    if(!this.ctx) return;
    const w=this.canvas.width, h=this.canvas.height;
    const x=Math.floor(nx*w), y=Math.floor(ny*h);
    if(x<0||y<0||x>=w||y>=h) return;
    const imgData=this.ctx.getImageData(0,0,w,h);
    const data=imgData.data;
    const idxOf=(cx,cy)=>(cy*w+cx)*4;
    const si=idxOf(x,y);
    const sr=data[si], sg=data[si+1], sb=data[si+2], sa=data[si+3];
    const fc=this.hexToRgb(color);
    if(Math.abs(sr-fc.r)<12 && Math.abs(sg-fc.g)<12 && Math.abs(sb-fc.b)<12 && sa>240) return; // already this color
    const tol=48;
    const matches=(i)=>{
      const dr=data[i]-sr, dg=data[i+1]-sg, db=data[i+2]-sb, da=data[i+3]-sa;
      return (dr*dr+dg*dg+db*db+da*da) <= tol*tol;
    };
    const visited=new Uint8Array(w*h);
    const stack=[[x,y]];
    let guard=0;
    while(stack.length && guard<w*h*2){
      guard++;
      const [cx,cy]=stack.pop();
      if(cx<0||cy<0||cx>=w||cy>=h) continue;
      const vi=cy*w+cx;
      if(visited[vi]) continue;
      const i=idxOf(cx,cy);
      if(!matches(i)) continue;
      visited[vi]=1;
      data[i]=fc.r; data[i+1]=fc.g; data[i+2]=fc.b; data[i+3]=255;
      stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
    }
    this.ctx.putImageData(imgData,0,0);
  },
  clearCanvas(){ if(this.ctx) this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height); },
  redrawAll(){
    this.clearCanvas();
    (this.state.strokes||[]).forEach(s=>{ if(s.mode==='fill') this.floodFillAt(s.x,s.y,s.color); else this.drawSeg(s); });
  },
  clear(){ if(!this.isDrawer()) return; this.state.strokes=[]; this.redoStack=[]; this.chan.send({type:'clear'}); this.clearCanvas(); this.chan.persist(this.state); },
  undo(){
    if(!this.isDrawer() || !this.state.strokes.length) return;
    const lastId=this.state.strokes[this.state.strokes.length-1].sid;
    const removed=[];
    while(this.state.strokes.length && this.state.strokes[this.state.strokes.length-1].sid===lastId){ removed.unshift(this.state.strokes.pop()); }
    this.redoStack.push(removed);
    this.chan.send({type:'undo', strokes:this.state.strokes}); this.redrawAll(); this.chan.persist(this.state);
  },
  redo(){
    if(!this.isDrawer() || !this.redoStack.length) return;
    const grp=this.redoStack.pop();
    grp.forEach(s=>this.state.strokes.push(s));
    this.chan.send({type:'undo', strokes:this.state.strokes}); this.redrawAll(); this.chan.persist(this.state);
  },
  // drawer picks/types their own word for this round
  fillWordSuggestion(text){ const inp=document.getElementById('dwWordIn'); if(inp){ inp.value=text; inp.focus(); } },
  voiceWord(){
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Rec){ toast('🎙️ Voice input not supported on this browser'); return; }
    const rec = new Rec(); rec.lang='en-US'; rec.interimResults=false;
    rec.onresult=(e)=>{ const txt=e.results[0][0].transcript; const inp=document.getElementById('dwWordIn'); if(inp) inp.value=txt; };
    rec.onerror=()=>toast('Couldn\'t hear that — try again');
    toast('🎙️ Listening…'); rec.start();
  },
  setWord(){
    if(!this.isDrawer()) return;
    const inp=document.getElementById('dwWordIn'); const val=(inp?.value||'').trim();
    if(!val){ toast('Type what you\'ll draw first ✍️'); return; }
    this.state.word=val; this.state.wordSet=true; this.state.roundStartedAt=Date.now(); this.state.strokes=[];
    Snd.tap(); this.sync(); this.clearCanvas(); this.render();
  },
  newWord(){ if(!this.isDrawer()) return; this.state.word=''; this.state.wordSet=false; this.state.strokes=[]; this.sync(); this.clearCanvas(); this.render(); },
  pickColor(c){ this.color=c; this.render(); setTimeout(()=>this.setupCanvas(),30); },
  pickSize(sz){ this.size=sz; this.render(); setTimeout(()=>this.setupCanvas(),30); },
  pickMode(m){ this.mode=m; this.render(); setTimeout(()=>this.setupCanvas(),30); },
  notifyTyping(){ if(this.isDrawer()) return; this.chan.send({type:'typing'}); },
  updateTypingUI(){ const el=document.getElementById('dwTyping'); if(el) el.textContent = this.partnerTyping ? esc(ID.myName)+' is typing…' : ''; },
  renderGuessLog(){
    const el=document.getElementById('dwGuessHist'); if(!el) return;
    el.innerHTML=(this.state.guessLog||[]).slice(-6).map(g=>`<div class="dw-guess-hist-row ${g.correct?'correct':''}">${esc(g.name)}: ${esc(g.text)}</div>`).join('');
    el.scrollTop=el.scrollHeight;
  },
  nextRound(scored){
    this.state.drawer = this.state.drawer==='user1'?'user2':'user1';
    this.state.word=''; this.state.wordSet=false; this.state.strokes=[]; this.state.round++;
    this.state.roundStartedAt=Date.now();
    this.sync(); this.clearCanvas(); this.render();
  },
  async guess(){
    if(this.checking) return;
    const inp=document.getElementById('dwGuessIn'); const raw=(inp.value||'').trim();
    if(!raw || !this.state.word) return;
    inp.value=''; this.checking=true;
    const btn=document.querySelector('.dw-guess-row .btn-pink'); if(btn){ btn.disabled=true; btn.textContent='Checking…'; }
    let correct=false;
    try{ correct = await dwCheckMatch(raw, this.state.word); }catch(e){ correct = dwNormalize(raw)===dwNormalize(this.state.word); }
    this.checking=false;
    if(btn){ btn.disabled=false; btn.textContent='Guess'; }
    const log=(this.state.guessLog||[]).concat([{name:ID.myName,text:raw,correct}]);
    this.state.guessLog=log; this.chan.send({type:'guesslog', log});
    if(correct){
      GameCore.addXP(20); GameCore.addCoins(8); Snd.success();
      this.state.scores[ID.role]=(this.state.scores[ID.role]||0)+1;
      showReward('🎉','Correct guess!',['The word was “'+this.state.word+'”','+20 XP']);
      this.nextRound(true);
    } else { toast('❌ Not quite — try again!'); Snd.fail(); this.renderGuessLog(); }
  },
  render(){
    const body=document.getElementById('goBody'); if(!body) return;
    const drawer=this.isDrawer();
    const wordSet = !!this.state.wordSet;

    // --- drawer/guesser both wait here until the drawer types their word ---
    if(!wordSet){
      body.className='gobody';
      body.innerHTML = `
        <div class="score-bar" style="margin-bottom:12px">
          <div class="score-pill ${ID.role==='user1'?'mine':''}"><div class="sp-name">${esc(ID.myName)}</div><div class="sp-val">${this.state.scores.user1||0}</div></div>
          <div class="score-pill ${ID.role==='user2'?'mine':''}"><div class="sp-name">${esc(ID.partnerName)}</div><div class="sp-val">${this.state.scores.user2||0}</div></div>
        </div>
        ${drawer ? `
        <div class="tod-compose">
          <div class="tod-compose-label">🎨 What will you draw?</div>
          <textarea class="tod-compose-box" id="dwWordIn" placeholder="Type the word or thing you'll draw…" style="min-height:56px"></textarea>
          <div class="tod-suggest-row">${DRAW_WORDS.map(w=>`<div class="tod-suggest-chip" onclick="Draw.fillWordSuggestion('${w.replace(/'/g,"\\'")}')">${esc(w)}</div>`).join('')}</div>
          <div style="display:flex;gap:8px;justify-content:center">
            <button class="btn btn-glass btn-sm" onclick="Draw.voiceWord()">🎙️ Voice</button>
            <button class="btn btn-pink btn-sm" onclick="Draw.setWord()">Start Drawing ➤</button>
          </div>
        </div>` : `
        <div class="tod-wheel-wrap"><div style="font-size:40px">✍️</div><div class="tod-bottle-hint">${esc(ID.partnerName)} is picking what to draw…</div></div>
        `}
      `;
      return;
    }

    // --- normal drawing/guessing round ---
    body.className='gobody nopad';
    body.innerHTML = `
      <div class="dw-wrap" style="height:100%">
        <div style="padding:10px 12px 0"><div class="score-bar" style="margin-bottom:8px">
          <div class="score-pill ${ID.role==='user1'?'mine':''}"><div class="sp-name">${esc(ID.myName)}</div><div class="sp-val">${this.state.scores.user1||0}</div></div>
          <div class="score-pill ${ID.role==='user2'?'mine':''}"><div class="sp-name">${esc(ID.partnerName)}</div><div class="sp-val">${this.state.scores.user2||0}</div></div>
        </div></div>
        <div class="dw-timerbar"><div class="dw-timerbar-fill" id="dwTimerFill" style="width:${(this.timerLeft/DW_ROUND_SECONDS*100)}%"></div></div>
        <div class="dw-toolbar">
          ${drawer ? DW_COLORS.map(c=>`<div class="dw-color ${this.color===c?'sel':''}" style="background:${c}" onclick="Draw.pickColor('${c}')"></div>`).join('') : `<div class="dw-word-reveal">🤔 ${esc(ID.partnerName)} is drawing — guess below!</div>`}
          ${drawer?`
            <div class="dw-tool-btn ${this.mode==='pen'?'sel':''}" style="cursor:pointer" onclick="Draw.pickMode('pen')" title="Pen">✏️</div>
            <div class="dw-tool-btn ${this.mode==='highlighter'?'sel':''}" style="cursor:pointer" onclick="Draw.pickMode('highlighter')" title="Highlighter">🖊️</div>
            <div class="dw-tool-btn ${this.mode==='eraser'?'sel':''}" style="cursor:pointer" onclick="Draw.pickMode('eraser')" title="Eraser">🧽</div>
            <div class="dw-tool-btn ${this.mode==='fill'?'sel':''}" style="cursor:pointer" onclick="Draw.pickMode('fill')" title="Fill">🪣</div>
            ${DW_SIZES.map(sz=>`<div class="dw-size-btn ${this.size===sz?'sel':''}" onclick="Draw.pickSize(${sz})"><div class="dw-size-dot" style="width:${Math.max(4,sz*0.55)}px;height:${Math.max(4,sz*0.55)}px;background:${this.mode==='eraser'?'#888':this.color}"></div></div>`).join('')}
            <button class="dw-tool-btn" onclick="Draw.undo()" title="Undo">↩️</button>
            <button class="dw-tool-btn" onclick="Draw.redo()" title="Redo">↪️</button>
            <button class="dw-tool-btn" onclick="Draw.clear()" title="Clear">🗑️</button>
            <button class="dw-tool-btn" onclick="Draw.newWord()" title="Pick a new word">🔀</button>
          `:''}
        </div>
        ${!drawer?`<div class="dw-hint-row" id="dwHintRow">${this.hintText(Math.floor((Date.now()-(this.state.roundStartedAt||Date.now()))/1000))}</div>`:''}
        <div class="dw-canvas-wrap">
          ${drawer?`<div class="dw-guess-banner">✏️ Draw: <strong>${esc(this.state.word)}</strong></div>`:''}
          <canvas id="dwCanvas"></canvas>
        </div>
        <div class="dw-guess-hist" id="dwGuessHist"></div>
        <div class="dw-react-row">${['😂','😍','🤔','🔥','👏'].map(e=>`<button class="dw-react-btn2" onclick="toast('${e}')">${e}</button>`).join('')}</div>
        ${!drawer?`
          <div class="dw-typing" id="dwTyping"></div>
          <div class="dw-guess-row"><input class="dw-guess-in" id="dwGuessIn" oninput="Draw.notifyTyping()" placeholder="Type your guess…" onkeydown="if(event.key==='Enter')Draw.guess()"><button class="btn btn-pink" onclick="Draw.guess()">Guess</button></div>
        `:''}
      </div>
    `;
    setTimeout(()=>this.setupCanvas(),30);
    this.renderGuessLog();
  }
};

/* ═══════════════════════════════════════════════════════
   GAME 5 — MEMORY MATCH
═══════════════════════════════════════════════════════ */
const MM_EMOJIS=['❤️','🌟','🎈','🍕','🌙','🐶','🎵','🌈'];
const Memory = {
  chan:null, state:null, busy:false,
  async open(body){
    this.chan = new GameChannel('memory');
    let st = await this.chan.load();
    if(!st) st = this.fresh();
    this.state = st;
    this.chan.listen(p=>{ if(p.type==='sync'){ this.state=p.state; this.render(); } });
    this.render();
  },
  close(){ if(this.chan) this.chan.close(); },
  sync(){ this.chan.send({type:'sync',state:this.state}); this.chan.persist(this.state); },
  fresh(){
    let deck=[...MM_EMOJIS,...MM_EMOJIS].map((e,i)=>({id:i,emoji:e,matched:false}));
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
    return { cards:deck, flipped:[], turn:'user1', scores:{user1:0,user2:0}, winner:null };
  },
  restart(){ this.state=this.fresh(); this.sync(); this.render(); },
  flip(i){
    const s=this.state;
    if(s.winner || s.turn!==ID.role || this.busy) return;
    if(s.cards[i].matched || s.flipped.includes(i)) return;
    s.flipped.push(i); Snd.tap();
    this.sync(); this.render();
    if(s.flipped.length===2){
      this.busy=true;
      const [a,b]=s.flipped;
      setTimeout(()=>{
        if(s.cards[a].emoji===s.cards[b].emoji){
          s.cards[a].matched=true; s.cards[b].matched=true;
          s.scores[ID.role]=(s.scores[ID.role]||0)+1;
          GameCore.addXP(6); GameCore.addCoins(3); Snd.success();
          s.flipped=[];
          if(s.cards.every(c=>c.matched)){
            s.winner = s.scores.user1>=s.scores.user2 ? 'user1':'user2';
            if(s.scores.user1===s.scores.user2) s.winner='draw';
            if(s.winner===ID.role) GameCore.addWin();
            setTimeout(()=>showReward('🧠','All pairs matched!',['Final: '+s.scores.user1+' - '+s.scores.user2]),300);
          }
        } else {
          Snd.fail(); s.flipped=[]; s.turn = s.turn==='user1'?'user2':'user1';
        }
        this.busy=false; this.sync(); this.render();
      },850);
    }
  },
  render(){
    const body=document.getElementById('goBody'); if(!body) return;
    const s=this.state, myTurn=s.turn===ID.role && !s.winner;
    body.innerHTML = `
      <div class="score-bar">
        <div class="score-pill ${ID.role==='user1'?'mine':''}"><div class="sp-name">${esc(ID.myName)}</div><div class="sp-val">${s.scores.user1||0}</div></div>
        <div class="score-pill ${ID.role==='user2'?'mine':''}"><div class="sp-name">${esc(ID.partnerName)}</div><div class="sp-val">${s.scores.user2||0}</div></div>
      </div>
      <div class="turn-bar ${myTurn?'mine':''}">${s.winner?(s.winner==='draw'?'🤝 It is a tie!':(s.winner===ID.role?'🎉 You won!':esc(ID.partnerName)+' won!')):(myTurn?'✨ Your turn — flip 2 cards':esc(ID.partnerName)+' is turn…')}</div>
      <div class="mm-grid">
        ${s.cards.map((c,i)=>{
          const shown = c.matched || s.flipped.includes(i);
          return `<div class="mm-card ${shown?(c.matched?'matched':'flipped'):''}" onclick="Memory.flip(${i})">${shown?c.emoji:''}</div>`;
        }).join('')}
      </div>
      <div style="text-align:center;margin-top:16px">${s.winner?'<button class="btn btn-accent" onclick="Memory.restart()">🔄 Play Again</button>':''}</div>
    `;
  }
};
