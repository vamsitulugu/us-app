<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Twin Hearts — Admin Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- ═══ Login screen ═══ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="orb"></div>
    <h1>Twin <em style="font-style:italic;color:#FFB6E6">Hearts</em></h1>
    <p class="sub">Admin Control Center</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn full" id="loginBtn">Sign in</button>
      <div class="error-msg" id="loginError"></div>
    </form>
  </div>
</div>

<!-- ═══ App shell ═══ -->
<div id="appShell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand">Twin <em>Hearts</em></span>
      <button class="collapse-btn" id="collapseBtn" title="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <nav class="nav" id="navList">
      <!-- populated by JS -->
    </nav>
    <div class="sidebar-footer">
      <div class="admin-email" id="adminEmailLabel"></div>
      <button class="btn secondary full small" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <main class="main">
    <div class="mobile-topbar"><button id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><span>Twin <em style="font-style:italic;color:#FFB6E6">Hearts</em></span></div>
    <div id="pageOverview" class="page"></div>
    <div id="pageUsers" class="page"></div>
    <div id="pageCouples" class="page"></div>
    <div id="pageReleases" class="page"></div>
    <div id="pageNotifications" class="page"></div>
    <div id="pageFlags" class="page"></div>
    <div id="pagePayments" class="page"></div>
    <div id="pageHealth" class="page"></div>
    <div id="pageSupport" class="page"></div>
    <div id="pageAudit" class="page"></div>
  </main>
</div>

<!-- ═══ Shared overlays ═══ -->
<div id="toastHost"></div>

<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmBody"></p>
    <div class="field" id="confirmTypeWrap" style="display:none">
      <label id="confirmTypeLabel"></label>
      <input type="text" id="confirmTypeInput">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" id="confirmCancelBtn">Cancel</button>
      <button class="btn danger" id="confirmOkBtn">Confirm</button>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer"></div>

<script src="/admin/admin.js"></script>
</body>
</html>
